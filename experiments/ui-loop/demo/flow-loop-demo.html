const OPEN = [8, 5, 4, 4, 3, 3, 2, 2, 1, 1, 0]
const resCls = (r) => (r.accept ? "ok" : r.rec.result === "没效果" ? "meh" : "bad")
const $ = (s) => document.querySelector(s)

function flow(r) {
  const on = (k) => !r || ({ rev: r.kind === "布局", gate: r.kind === "布局", comp: r.kind === "组件", human: r.kind === "组件" }[k] ?? true)
  const st = (k, t) => `<span class="step ${r && on(k) ? "on" : ""}">${t}</span>`
  $("#flow").innerHTML = `${[["a", "生成页面"], ["b", "程序检查"], ["c", "审美 judge（两种顺序）"], ["d", "Maintainer 归类"]].map(([k, t]) => st(k, t)).join('<span class="arr">→</span>')}<span class="arr">→</span><span class="fork">${st("comp", "组件不够 → 组件 Agent（优先）")}${st("rev", "布局问题 → Reviser 改输出指南")}</span><span class="arr">→</span><span class="fork">${st("human", "人工审批")}${st("gate", "门禁：留出页 3 轮")}</span><span class="arr">→</span>${st("e", "记录员")}`
}

function chart(sel) {
  const W = 680, H = 150, x0 = 34, x1 = 660, y0 = 118, y1 = 14
  const X = (i) => x0 + (i * (x1 - x0)) / 10, Y = (v) => y0 - (v / 8) * (y0 - y1)
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每轮之后还没解决的问题数">`
  for (const g of [0, 4, 8]) s += `<line x1="${x0}" x2="${x1}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${x0 - 8}" y="${Y(g) + 4}" text-anchor="end">${g}</text>`
  s += `<polyline points="${OPEN.map((v, i) => `${X(i)},${Y(v)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`
  s += `<text x="${X(1) + 10}" y="${Y(5) - 8}" text-anchor="start">组件问题先处理：−3</text>`
  OPEN.forEach((v, i) => {
    const r = R[i - 1], col = i === 0 ? "var(--muted)" : `var(--${resCls(r)})`, id = i === 0 ? "g0" : r.id
    s += `<g style="cursor:pointer" data-go="${id}">${id === sel ? `<circle cx="${X(i)}" cy="${Y(v)}" r="9" fill="none" stroke="${col}" stroke-width="1.5"/>` : ""}<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${col}"/><text x="${X(i)}" y="${H - 8}" text-anchor="middle">${id}</text></g>`
  })
  $("#chart").innerHTML = s + "</svg>"
  $("#chart").querySelectorAll("[data-go]").forEach((g) => g.addEventListener("click", () => go(g.dataset.go)))
}

function chips(sel) {
  const list = [{ id: "g0", t: "g0 初版", c: "base" }, ...R.map((r) => ({ id: r.id, t: `${r.n} · ${r.id}`, c: resCls(r) })), { id: "final", t: "最终对比", c: "base" }]
  $("#chips").innerHTML = list.map((x) => `<button class="chip ${x.id === sel ? "sel" : ""}" role="tab" aria-selected="${x.id === sel}" data-go="${x.id}"><i class="dot d-${x.c}"></i>${x.t}</button>`).join("")
  $("#chips").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)))
}

const vcell = (c) => `<td class="c ${c === "h" ? "v-h" : c === "q" ? "v-q" : "v-e"}">${c === "h" ? "后" : c === "q" ? "前" : "平"}</td>`
function judgePanel(r) {
  const rows = CRIT.map((k, i) => {
    const a = r.j.o1[i], b = r.j.o2[i]
    const v = a === b && a !== "-" ? (a === "h" ? '<span class="v-h">改后更好</span>' : '<span class="v-q">改前更好</span>') : a !== b ? '<span class="v-e">不一致</span>' : ""

function gatePanel(r) {

function recPanel(r) {

function problemPanel(n, r) {
  const ids = Object.keys(PROB).filter((p) => SOLVED[p] >= n).sort((a, b) => (PROB[b].cause === "组件不够") - (PROB[a].cause === "组件不够"))
  const done = Object.keys(PROB).filter((p) => SOLVED[p] < n)
  const status = (p) => (r.g0 ? `<span class="pill p-base">待解决</span>` : SOLVED[p] === n ? `<span class="pill p-ok">本轮解决</span>` : r.tg.includes(p) ? `<span class="pill p-bad">本轮没解决</span>` : `<span class="pill p-base">待解决</span>`)
  return `<div class="panel"><h3>问题清单 · 本轮开始时<span class="small">${ids.length} 个未解决</span></h3><ul class="plain">${ids.map((p) => `<li class="prob ${r.tg.includes(p) ? "tgt" : ""}"><span class="id">${p}</span><span>${PROB[p].text}</span><span class="meta"><span>${PROB[p].crit}</span>·<span>${PROB[p].cause}</span>${status(p)}</span></li>`).join("")}</ul>${done.length ? `<p class="small" style="margin-top:10px">已解决：${done.map((p) => `${p}（${R[SOLVED[p] - 1].id}）`).join("、")}</p>` : ""}</div>`
}
function changePanel(r) {
  if (r.kind === "组件") return `<div class="panel"><h3>组件 Agent · 提案 k1<span class="small">针对 ${r.tg.join("、")}</span></h3><p class="rule new">${r.comp}</p><p class="small" style="margin-top:8px">问题清单里有组件不够的问题，先路由到组件 Agent，布局问题等组件采用后再改。</p></div>`
  const g = GUIDE.find((x) => x.id === r.rule), prev = R.slice(0, r.n - 1)

}
function guidePanel(n) {
  const rules = GUIDE.filter((g) => g.at <= n)
  return `<div class="panel"><h3>本轮之后的输出指南<span class="small">新增 ${rules.length} 条${n >= 1 ? " · 组件库含 k1" : ""}</span></h3>${rules.length ? `<ul class="plain">${rules.map((g) => `<li class="prob ${g.at === n ? "tgt" : ""}"><span class="id">${g.id}</span><span>${g.text}</span></li>`).join("")}</ul>` : `<p class="small">输出指南还没有新增规则，用的是 design.md 原有的 A、B、C 三部分。</p>`}</div>`
}

function shot(ver, focus) {
  const b = BOXES[ver], marks = (focus || []).map((t) => {
    const s = b.sections[t]
    if (!s) return ""
    const pad = 16
    return `<div class="mark" style="left:${((s.x - pad) / b.width) * 100}%;top:${((s.y - pad) / b.height) * 100}%;width:${((s.w + 2 * pad) / b.width) * 100}%;height:${((s.h + 2 * pad) / b.height) * 100}%"><span>改动处</span></div>`
  }).join("")
  return `<div class="shot" data-ver="${ver}"><img src="pages/${ver}.png" alt="页面 ${ver} 的截图" width="1248" height="${b.height}" loading="lazy">${marks}</div>`
}
function frames(lv, lt, rv, rt, focus) {
  return `<div class="frames"><div class="frame"><div class="cap"><span>改动前 · <b>${lt}</b></span></div><div class="viewport" data-sync>${shot(lv, [])}</div></div><div class="frame"><div class="cap"><span>改动后 · <b>${rt}</b></span><span>虚线框为改动处</span></div><div class="viewport" data-sync>${shot(rv, focus)}</div></div></div>`
}
let lock = false
function sync() {
  const vs = [...document.querySelectorAll("[data-sync]")]
  vs.forEach((v) => v.addEventListener("scroll", () => {
    if (lock) return
    lock = true
    const f = v.scrollTop / Math.max(1, v.scrollHeight - v.clientHeight)
    vs.forEach((o) => { if (o !== v) o.scrollTop = f * (o.scrollHeight - o.clientHeight) })
    requestAnimationFrame(() => (lock = false))
  }))
}
function scrollToFocus(r) {
  if (!r) return
  const vs = [...document.querySelectorAll("[data-sync]")]
  lock = true
  setTimeout(() => (lock = false), 100)
  vs.forEach((v, i) => {
    const ver = i === 0 ? r.base : r.cand, s = BOXES[ver].sections[r.focus[0]], img = v.querySelector("img")
    if (s && img) v.scrollTop = Math.max(0, (s.y / BOXES[ver].height) * img.clientHeight - 40)
  })
}

function go(id) {

  let html
  if (id === "g0") {
    flow(null)
    html = `<div class="head"><div><h2>g0 · 初版</h2><p class="sub">生成 Agent 按 design.md 写的页面（k3 之前的组件库）。审美 judge 拿它和同一指南再生成的一版比，Maintainer 列出 8 个问题，其中 3 个是组件不够。</p></div>${nav}</div>
    ${frames("g0", "g0", "g0", "g0", [])}<div class="grid">${problemPanel(1, { tg: [], g0: true })}${guidePanel(0)}</div>`
  } else if (id === "final") {
    flow(null)
    const n = (k) => R.filter((x) => x.rec.result === k).length
    html = `<div class="head"><div><h2>最终对比 · g0 和 g6</h2><p class="sub">问题清单清空后 loop 停止。</p></div>${nav}</div>
    <div class="panel stats"><span><b>10</b>轮迭代</span><span><b style="color:var(--ok)">${n("成功")}</b>次成功并采用</span><span><b style="color:var(--bad)">${n("失败")}</b>次失败</span><span><b style="color:var(--meh)">${n("没效果")}</b>次没效果</span><span><b>5</b>条新规则</span><span><b>1</b>次组件修改（人工审批）</span><span><b>8</b>个问题全部解决</span></div>
    ${frames("g0", "g0 初版", "g6", "g6 最终版", [])}<div class="grid">${guidePanel(10)}</div>`
  } else {
    flow(r)
    html = `<div class="head"><div><h2>第 ${r.n} 轮 · ${r.id} <span class="pill p-${resCls(r)}">${r.rec.result} · ${r.accept ? "采用" : "未采用"}</span></h2><p class="sub">${r.kind === "组件" ? "组件不够 → 组件 Agent" : "布局问题 → Reviser"} · 针对 ${r.tg.map((t) => `${t} ${PROB[t].crit}`).join("、")} · 基于 ${r.bl}${r.ver ? ` · 采用后成为 ${r.ver}` : ""}</p></div>${nav}</div>
    ${frames(r.base, r.bl, r.cand, `${r.cl}${r.accept ? "" : "（未采用）"}`, r.focus)}
    <div class="grid">${changePanel(r)}${judgePanel(r)}${gatePanel(r)}${recPanel(r)}${problemPanel(r.n, r)}${guidePanel(r.accept ? r.n : r.n - 1)}</div>
    ${r.after ? `<div class="panel" style="font-size:13px"><span class="label">本轮之后</span><p style="margin-top:4px">${r.after}</p></div>` : ""}`
  }
  $("#detail").innerHTML = html
  $("#detail").querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => go(order[idx + Number(b.dataset.step)])))
  chips(id)
  chart(id)
  sync()
  if (r) {
    const imgs = [...document.querySelectorAll("[data-sync] img")]
    Promise.all(imgs.map((i) => (i.complete ? 0 : new Promise((ok) => { i.onload = ok; i.onerror = ok })))).then(() => scrollToFocus(r))
  }
  try { history.replaceState(null, "", `#${id}`) } catch (e) {}
}

$("#log").innerHTML = `<thead><tr><th>轮</th><th>改动</th><th>针对</th><th>结论</th><th>门禁 / 审批</th><th>教训</th></tr></thead><tbody>${R.map((r) => `<tr data-go="${r.id}"><td style="white-space:nowrap">${r.n} · ${r.id}</td><td>${r.rec.practice}</td><td style="white-space:nowrap">${r.tg.join("、")}</td><td><span class="pill p-${resCls(r)}">${r.rec.result}</span></td><td style="white-space:nowrap">${r.approval ? "人工审批采用" : r.accept ? "采用" : "未采用"}</td><td>${r.rec.lesson}</td></tr>`).join("")}</tbody>`
$("#log").querySelectorAll("[data-go]").forEach((t) => t.addEventListener("click", () => { go(t.dataset.go); $("#detail").scrollIntoView({ block: "start" }) }))
document.addEventListener("keydown", (e) => {
  const order = ["g0", ...R.map((x) => x.id), "final"], i = order.indexOf(document.querySelector(".chip.sel")?.dataset.go)
  if (e.key === "ArrowRight" && i < order.length - 1) go(order[i + 1])
  if (e.key === "ArrowLeft" && i > 0) go(order[i - 1])
})
const start = location.hash.slice(1)
go(["g0", "final", ...R.map((x) => x.id)].includes(start) ? start : "k1")
</script>
