<script>
/* ============================================================ utilities */
const W = 1920, H = 1080, FPS = 60;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const oQ = x => 1 - Math.pow(1 - x, 4);
const oC = x => 1 - Math.pow(1 - x, 3);
const ioC = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const oB = (x, s = 1.2) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6d2b79f5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || document.body).appendChild(e); return e; };
const NS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

/* ============================================================ timeline — paced by reading
   Scene code is authored on a compact "animation clock": 背景 at STEP[0], 解法 at STEP[1], 结果 at STEP[2],
   hand-off at OUT. plan() gives every step enough real time to read its text (READ_CPS characters a second
   plus LEAD to take in the drawing), rounded to whole beats of the 96 BPM score. The animation plays at
   SPEED of its authored pace, then holds until the reader is done. */
const BEAT = 0.625;
const READ_CPS = 7.5, LEAD = 1.0, SPEED = 0.75;
const STEP = [0.625, 2.5, 4.375], OUT = 6.0, END = 6.25, HANDOFF = 0.4;
const readLoad = html => { const s = html.replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/g, ' '); return (s.match(/[㐀-鿿]/g) || []).length + (s.match(/[A-Za-z0-9][\w.+%\/−-]*/g) || []).length; };
const beats = (sec, min) => Math.max(min, Math.ceil(sec / BEAT - 1e-6)) * BEAT;
function plan(c) {
  const look = c.look || [0, 0, 0];  // extra seconds for denser drawings
  const r = [2 * BEAT,
    beats(LEAD + look[0] + readLoad(c.steps[0]) / READ_CPS, 7),
    beats(LEAD + look[1] + readLoad(c.steps[1]) / READ_CPS, 8),
    beats(LEAD + look[2] + 1.0 + readLoad(c.metrics ? c.metrics.flat().join(' ') : c.result) / READ_CPS, 8)];
  const segs = [[0, STEP[0], r[0]], [STEP[0], STEP[1], r[1]], [STEP[1], STEP[2], r[2]], [STEP[2], OUT, r[3] - HANDOFF]];
  const map = [[0, 0]]; let x = 0;
  // play at SPEED, then hold the clock still (not creeping, or the next step's fade-outs would start early).
  // The title beat never holds: 背景's drawing starts fading in before it ends, and a hold would freeze it half-drawn.
  segs.forEach(([a0, a1, R], i) => { const act = Math.min(R, (a1 - a0) / SPEED), h = a0 + (a1 - a0) * .97;
    if (i > 0 && act < R - .15) map.push([x + act, h], [x + R - .1, h]); x += R; map.push([x, a1]); });
  x += HANDOFF; map.push([x, END]);
  return { map, dur: x, steps: [r[0], r[0] + r[1], r[0] + r[1] + r[2]] };
}
function warp(x, map) {
  for (let i = 1; i < map.length; i++) if (x <= map[i][0]) return lerp(map[i - 1][1], map[i][1], (x - map[i - 1][0]) / (map[i][0] - map[i - 1][0]));
  return map[map.length - 1][1] + (x - map[map.length - 1][0]);
}

/* ============================================================ left column: header + 背景 / 解法 / 结果 */
function LeftCol(parent, c) {
  const root = $('div', 'layer', parent);
  const kick = $('div', 'kick abs', root, `<b>${c.idx}</b>${c.kicker}`); at(kick, 120, 236);
  const tm = $('div', 'mask abs', root); at(tm, 120, 264);
  const title = $('div', 'title' + (c.latin ? ' latin' : ''), tm, c.title);
  const sub = $('div', 'sub abs', root, c.sub); at(sub, 120, 326);
  const wrap = $('div', 'steps', root);
  const tops = [0, 150, 300];
  const rail = $('div', 'rail', wrap); st(rail, { height: tops[2] + 'px' });
  const railFill = $('div', 'rail', wrap); st(railFill, { background: 'var(--accent)', height: '0px' });
  const labels = [['背景', 'BACKGROUND'], ['解法', 'SOLUTION'], ['结果', 'RESULT']];
  const steps = labels.map(([zh, en], i) => {
    const s = $('div', 'step', wrap); st(s, { top: tops[i] + 'px' });
    const lab = $('div', 'lab', s, `${zh}<i>${en}</i>`);
    const body = i < 2 ? $('div', 'txt', s, c.steps[i])
      : c.metrics ? $('div', 'metrics', s, c.metrics.map(m => `<div class="metric"><div class="v">${m[0]}</div><div class="l">${m[1]}</div></div>`).join(''))
      : $('div', 'txt', s, c.result);
    const dot = $('div', 'dot', wrap); st(dot, { top: tops[i] + 6 + 'px' });
    return { s, lab, body, dot, parts: i < 2 || !c.metrics ? [body] : [...body.children] };
  });
  return {
    render(u) {
      const out = oC(P(u, OUT, OUT + .25));
      st(root, { opacity: 1 - out, transform: `translateY(${-out * 16}px)` });
      rise(kick, u, 0, .45, 10);
      const tp = oQ(P(u, .05, .65)); st(title, { transform: `translateY(${(1 - tp) * 105}%)` });
      rise(sub, u, .2, .5, 10);
      steps.forEach((s, i) => {
        const t0 = STEP[i];
        rise(s.lab, u, t0, .45, 10);
        s.parts.forEach((m, k) => rise(m, u, t0 + .1 + k * .14, .55, 12));
        // once the next step arrives, earlier ones recede but stay readable
        const next = i < 2 ? P(u, STEP[i + 1], STEP[i + 1] + .4) : 0;
        st(s.s, { filter: `opacity(${1 - .45 * next})` });
        const on = P(u, t0, t0 + .3);
        st(s.dot, { background: on > 0 ? `rgba(194,65,12,${on})` : 'var(--page)', borderColor: on > 0 ? 'var(--accent)' : 'var(--faint)', opacity: P(u, .45, .7) });
      });
      st(rail, { opacity: P(u, .45, .7) });
      const fill = u < STEP[1] ? 0 : u < STEP[2] ? 150 * oQ(P(u, STEP[1], STEP[1] + .5)) : 150 + 150 * oQ(P(u, STEP[2], STEP[2] + .5));
      st(railFill, { height: fill + 'px', opacity: P(u, .45, .7) });
    },
  };
}

      // 解法
      const shift = ioC(P(u, s2, s2 + .6));
      st(tree, { opacity: P(u, s1, s1 + .2), transform: `translate(${-shift * 215}px, ${shift * 90}px) scale(${1 - shift * .24})`, transformOrigin: `${RX}px 250px` });
      const rp = oB(P(u, s1, s1 + .25)); st(root, { transform: `scale(${Math.max(0, rp)})` });
      edges.forEach(({ n, path, lab }) => {
        const k0 = n.rec ? s1 + 1.05 + (n.i - 5) * .1 : s1 + .2 + n.i * .1; const p = oC(P(u, k0, k0 + .25));
        if (n.rec) path.style.opacity = p; else draw(path, p);
        lab.style.opacity = P(u, k0 + .1, k0 + .25);
        const k = oB(P(u, k0 + .12, k0 + .35)); st(n.el, { transform: `scale(${Math.max(0, k)})`, opacity: Math.min(1, k * 2) });
      });
      st(sig, { opacity: P(u, s1 + .75, s1 + .85) * (1 - P(u, s2 - .05, s2 + .15)), transform: `translateX(${(1 - oQ(P(u, s1 + .75, s1 + 1.05))) * 16}px)` });
      // 结果
      cmp.render(u, s2 + .15);
    },
  };
})();

/* ============================================================ 06 · 跨社交媒体舆情分析与治理平台
   背景: monitoring / assessment / handling fragmented; five modules' algorithms not yet a product
   → 解法: three-layer IA (大屏 / 仪表盘 / 中台), five tech teams coordinated
   → 结果: delivered 0 → 1, supporting the National Key R&D Program milestone */
const P6 = (() => {
  const sc = Scene(T.p6);
  const L = LeftCol(sc.root, COPY.p6);
  const pn = $('div', 'layer', sc.root);
  const svg = S('svg', { class: 'full' }, pn);
  // workflow stages
  const stages = [['监控', 930], ['研判', 1230], ['处置', 1530]].map(([n, x]) => { const e = $('div', 'stg', pn, n); at(e, x, 214); return { e, x }; });
  const brk = [[1050, 1230], [1350, 1530]].map(([a, b]) => ({
    dash: S('line', { x1: a + 6, y1: 236, x2: b - 6, y2: 236, stroke: 'rgba(23,27,38,0.3)', 'stroke-dasharray': '3 6' }, svg),
    solid: S('path', { d: `M${a + 6},236 L${b - 8},236`, fill: 'none', stroke: '#c2410c', 'stroke-width': 1.6, 'marker-end': 'url(#arrA)' }, svg),
    x: (a + b) / 2,
  }));
  const cuts = brk.map(b => { const g = S('g', {}, svg); S('line', { x1: b.x - 6, y1: 226, x2: b.x + 6, y2: 246, stroke: '#c2410c', 'stroke-width': 1.6 }, g); return g; });
  // five technical modules
  const rnd = mulberry32(9);
  const mods = Array.from({ length: 5 }, (_, i) => {
    const e = $('div', 'modl', pn, `技术模块 0${i + 1}`);
    return { e, sx: 900 + (i % 3) * 300 + rnd() * 90, sy: 430 + Math.floor(i / 3) * 190 + rnd() * 70, rot: (rnd() - .5) * 10, cx: 870, cy: 360 + i * 84 };
  });
  const feeds = mods.map(() => S('path', { fill: 'none', stroke: 'rgba(194,65,12,0.5)', 'stroke-width': 1.2 }, svg));
  const scat = $('div', 'abs zh13', pn, '信息分散 · 流程割裂'); at(scat, 1230, 300);
  // three-layer information architecture (drawn, isometric)
  const stack = $('div', 'layer', pn);
  const LAYERS = [
    { n: '可视化大屏', y: 330, draw: g => { const r = mulberry32(5); for (let k = 0; k < 42; k++) { const a = r() * Math.PI * 2, d = Math.sqrt(r()) * 70; S('circle', { cx: 190 + Math.cos(a) * d * 1.5, cy: 120 + Math.sin(a) * d * .8, r: 4 + r() * 9, fill: k % 11 === 0 ? '#c2410c' : '#d5d9e1', opacity: .9 }, g); } } },
    { n: '工作台仪表盘', y: 470, draw: g => { [0, 1, 2].forEach(k => S('rect', { x: 24 + k * 116, y: 24, width: 104, height: 56, rx: 6, fill: '#eef0f3' }, g)); S('path', { d: 'M24,190 C80,150 120,176 170,140 S270,110 356,128', fill: 'none', stroke: '#c2410c', 'stroke-width': 2 }, g); S('line', { x1: 24, y1: 208, x2: 356, y2: 208, stroke: '#d5d9e1' }, g); } },
    { n: '可视化中台', y: 610, draw: g => { for (let k = 0; k < 6; k++) { const x = 24 + (k % 3) * 116, y = 24 + Math.floor(k / 3) * 100; S('rect', { x, y, width: 104, height: 88, rx: 6, fill: '#eef0f3' }, g); for (let b = 0; b < 4; b++) { const h = 10 + ((k * 7 + b * 13) % 40); S('rect', { x: x + 14 + b * 20, y: y + 70 - h, width: 12, height: h, fill: b === 1 ? '#c2410c' : '#c3c8d3' }, g); } } } },
  ];
  const planes = LAYERS.map((l, i) => {
    const holder = $('div', 'abs', stack); at(holder, 1240, l.y - 60); st(holder, { width: '340px', height: '214px', zIndex: 3 - i });
    const p = $('div', 'plane', holder); st(p, { left: 0, top: 0 });
    const g = S('svg', { width: 380, height: 240, style: 'transform:scale(0.895);transform-origin:0 0' }, p); l.draw(g);
    const lab = $('div', 'abs', stack, `<span class="mono" style="color:var(--accent);font-size:12px;margin-right:10px">L${i + 1}</span>${l.n}`); at(lab, 1590, l.y + 40); st(lab, { fontSize: '15px', whiteSpace: 'nowrap', zIndex: 5 });
    return { holder, lab };
  });
  const done = $('div', 'abs', pn, '<span style="font-family:var(--mono);font-size:22px;color:var(--accent)">✓</span>&nbsp; 完整落地 · 支撑国家重点研发计划交付'); at(done, 1120, 830); st(done, { fontSize: '15px', whiteSpace: 'nowrap' });

  const t0 = T.p6[0];
  return {
    render(t) {
      if (!sc.on(t)) return;
      const u = warp(t - t0, PLAN.p6.map);
      L.render(u);
      st(pn, { opacity: 1 - oC(P(u, OUT, OUT + .25)) });
      const s1 = STEP[1], s2 = STEP[2];
      // 背景: stages that don't connect, modules adrift
      stages.forEach((s, i) => rise(s.e, u, .55 + i * .1, .5, 10));
      brk.forEach((b, i) => { b.dash.style.opacity = P(u, .8, 1.0) * (1 - P(u, s1 + .3, s1 + .5)); draw(b.solid, oQ(P(u, s1 + .35 + i * .15, s1 + .7 + i * .15))); });
      cuts.forEach(c => c.style.opacity = P(u, .9, 1.1) * (1 - P(u, s1 + .25, s1 + .4)));
      scat.style.opacity = rise(scat, u, 1.2, .5, 6) * (1 - P(u, s1, s1 + .3));
      mods.forEach((m, i) => {
        const inn = oQ(P(u, .9 + i * .1, 1.4 + i * .1));
        const g = ioC(P(u, s1 + .1 + i * .06, s1 + .7 + i * .06));
        const x = lerp(m.sx, m.cx, g), y = lerp(m.sy + Math.sin(u * 1.4 + i) * 4, m.cy, g);
        st(m.e, { left: x + 'px', top: y + 'px', opacity: inn, transform: `rotate(${m.rot * (1 - g)}deg)`, color: g >= 1 ? 'var(--ink)' : 'var(--dim)' });
        const f = feeds[i], fp = oQ(P(u, s1 + .8 + i * .06, s1 + 1.3 + i * .06));
        f.setAttribute('d', `M${m.cx + 132},${m.cy + 22} C${m.cx + 220},${m.cy + 22} 1170,680 1262,680`); draw(f, fp);
      });
      // 解法: the stack assembles layer by layer
      planes.forEach((p, i) => {
        const k = oQ(P(u, s1 + .3 + i * .18, s1 + .9 + i * .18));
        st(p.holder, { opacity: k, transform: `translateY(${(1 - k) * 40}px)` });
        rise(p.lab, u, s1 + .6 + i * .18, .45, 8);
      });
      // 结果
      rise(done, u, s2 + .3, .5, 10);
    },
  };
})();

/* ============================================================ OUTRO */
const OUTRO = (() => {
  const sc = Scene(T.outro);
  const r = sc.root;
  const nm = $('div', 'mask abs', r);
  const name = $('div', '', nm, '屈非塬'); st(name, { fontSize: '56px', fontWeight: 500, letterSpacing: '0.12em', whiteSpace: 'nowrap' });
  const en = $('div', 'abs nowrap', r, 'QU FEIYUAN'); st(en, { fontFamily: 'var(--display)', fontWeight: 700, fontSize: '15px', letterSpacing: '0.34em', color: 'var(--dim)' });
  const hl = $('div', 'abs', r); st(hl, { height: '2px', background: 'var(--accent)', width: '0px', top: '552px' });
  const role = $('div', 'abs nowrap', r, '设计 · 工程 · AI'); st(role, { fontSize: '22px' });
  const ct = $('div', 'abs nowrap mono', r, 'feiyuan_qu@zju.edu.cn &nbsp; · &nbsp; qfy1012.github.io'); st(ct, { fontSize: '15px', color: 'var(--dim)', letterSpacing: '0.04em' });
  const center = (e, y) => { const w = e.getBoundingClientRect().width; at(e, (W - w) / 2, y); };
  return {
    layout() { vis(r, true); center(nm, 424); center(en, 508); center(role, 574); center(ct, 626); vis(r, false); },
    render(t) {
      if (!sc.on(t)) return;
      const u = warp(t - T.outro[0], OUTRO_CLOCK);
      const p = oQ(P(u, .1, .8)); st(name, { transform: `translateY(${(1 - p) * 105}%)` });
      rise(en, u, .35, .5, 8);
      const w = 48 * oQ(P(u, .45, .9)); st(hl, { width: w + 'px', left: (W - w) / 2 + 'px' });
      rise(role, u, .55, .5, 10); rise(ct, u, .75, .5, 10);
    },
  };
})();

/* ============================================================ HUD: name, chapter index, progress */
const HUD = (() => {
  const h = document.getElementById('hud');
  const tl = $('div', 'abs kick', h, '屈非塬 &nbsp;·&nbsp; QU FEIYUAN'); at(tl, 120, 70);
  const tr = $('div', 'abs kick', h); st(tr, { right: '120px', top: '70px' });
  const n = KEYS.length, span = 1680, gap = 20, w = (span - gap * (n - 1)) / n;
  const segs = KEYS.map((k, i) => { const s = $('div', 'seg', h); st(s, { left: 120 + i * (w + gap) + 'px', width: w + 'px' }); const l = $('div', 'l', s, `${COPY[k].idx}&nbsp;&nbsp;${COPY[k].hud}`); $('div', 't', s); const f = $('div', 'f', s); return { l, f, r: T[k] }; });
  return {
    render(t) {
      h.style.opacity = P(t, T.p1[0] - .2, T.p1[0] + .25) * (1 - P(t, T.outro[0] - .25, T.outro[0] + .2));
      const cur = KEYS.findIndex(k => t >= T[k][0] && t < T[k][1]);
      tr.innerHTML = cur >= 0 ? `<b style="color:var(--accent);font-weight:500">${COPY[KEYS[cur]].idx}</b> &nbsp;/&nbsp; 0${n}` : '';
      segs.forEach(s => {
        s.f.style.width = P(t, s.r[0], s.r[1]) * 100 + '%';
        s.f.style.background = t >= s.r[1] ? 'var(--faint)' : 'var(--accent)';
        s.l.style.color = t >= s.r[0] && t < s.r[1] ? 'var(--ink)' : 'var(--dimmer)';
      });
    },
  };
})();

/* ============================================================ frame */
function renderFrame(t) {
  t = clamp(t, 0, DUR - 1e-6);
  st(panelBg, { opacity: P(t, T.p1[0] - .3, T.p1[0] + .3) * (1 - P(t, T.outro[0] - .3, T.outro[0] + .2)), transform: `translateY(${(1 - oQ(P(t, T.p1[0] - .3, T.p1[0] + .3))) * 20}px)` });
  INTRO.render(t); P1.render(t); P2.render(t); P3.render(t); P4.render(t); P5.render(t); P6.render(t); OUTRO.render(t);
  HUD.render(t);
}

async function boot() {
  await document.fonts.ready;
  await Promise.all(['Syne', 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC Fallback'].flatMap(f => [400, 500, 700].map(w => document.fonts.load(`${w} 40px "${f}"`, '屈非塬设计热皮肤Aa'))));
  P4.layout(); P5.layout(); OUTRO.layout();
  window.renderFrame = renderFrame;
  // the score (soundtrack.py) reads these cues so its chimes and ticks land on the same beats
  window.SHOWREEL = { duration: DUR, fps: FPS, beat: BEAT, intro: T.intro, outro: T.outro,
    chapters: KEYS.map(k => ({ id: k, start: T[k][0], end: T[k][1], steps: PLAN[k].steps.map(s => T[k][0] + s) })) };
  const q = new URLSearchParams(location.search);
  if (q.has('play')) {
    document.body.classList.add('preview');
    const start = performance.now();
    const loop = () => { renderFrame(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); };
    loop();
  } else renderFrame(parseFloat(q.get('t') || '0'));
  window.__ready = true;
}
boot();
</script>
