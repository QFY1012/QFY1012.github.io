<title>竞品分析迭代演示</title>
<style>
/* Layout: a round picker and problem-count track on top; the selected round below as before/after report frames, then judge, gate, recorder, problem list and guide panels. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #1b2027; --muted: #5c6570; --line: #dde1e7; --chip: #eceff3;
  --accent: #2f56c8; --ok: #1e7f55; --ok-bg: #e3f2ea; --bad: #b9402b; --bad-bg: #f9e7e3; --meh: #9a6a12; --meh-bg: #f8eed7;
  --rp-mark: #2f56c8;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111418; --surface: #181c22; --ink: #e5e8ed; --muted: #9aa2ad; --line: #2b313a; --chip: #232932;
  --accent: #8ea6f2; --ok: #5cc795; --ok-bg: #16301f; --bad: #f08a74; --bad-bg: #3a1e18; --meh: #e2b259; --meh-bg: #33280f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111418; --surface: #181c22; --ink: #e5e8ed; --muted: #9aa2ad; --line: #2b313a; --chip: #232932;
  --accent: #8ea6f2; --ok: #5cc795; --ok-bg: #16301f; --bad: #f08a74; --bad-bg: #3a1e18; --meh: #e2b259; --meh-bg: #33280f; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.6 }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 22px }
h1, h2, h3 { text-wrap: balance; margin: 0 }
.top { display: grid; gap: 6px }
.top h1 { font-size: 24px; font-weight: 650; letter-spacing: .2px }
.top p { margin: 0; color: var(--muted); max-width: 70ch }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); vertical-align: 2px; margin-left: 8px; font-weight: 500 }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0 }
.label { font-size: 12px; color: var(--muted); letter-spacing: .4px }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px }
.flow span.step { padding: 3px 10px; border-radius: 6px; background: var(--chip); color: var(--muted); white-space: nowrap }
.flow span.step.on { background: var(--accent); color: var(--surface) }
.flow .arr { color: var(--muted) }
.flow .fork { display: inline-flex; flex-direction: column; gap: 4px }
.track { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 10px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.chip:hover { border-color: var(--accent) }
.chip:focus-visible, .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chip.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none }
.d-ok { background: var(--ok) } .d-bad { background: var(--bad) } .d-meh { background: var(--meh) } .d-base { background: var(--muted) }
.chart svg { width: 100%; height: auto; display: block }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--sans) }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; gap: 6px; align-items: center }
.head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; justify-content: space-between }
.head h2 { font-size: 19px; font-weight: 650 }
.head .sub { color: var(--muted); font-size: 13px }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap }
.p-ok { background: var(--ok-bg); color: var(--ok) } .p-bad { background: var(--bad-bg); color: var(--bad) } .p-meh { background: var(--meh-bg); color: var(--meh) } .p-base { background: var(--chip); color: var(--muted) }
.nav { display: flex; gap: 6px }
.nav button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer }
.nav button:disabled { opacity: .4; cursor: default }
.frames { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
@media (max-width: 860px) { .frames { grid-template-columns: minmax(0, 1fr) } }
.frame { display: grid; gap: 6px; min-width: 0 }
.frame .cap { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted) }
.frame .cap b { color: var(--ink); font-weight: 600 }
.viewport { height: 620px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: #ffffff }
@media (max-width: 860px) { .viewport { height: 460px } }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; align-items: start }
.panel h3 { font-size: 14px; font-weight: 650; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.panel p { margin: 0 }
.kv { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 6px 10px; font-size: 13px }
.kv dt { color: var(--muted) } .kv dd { margin: 0 }
.rule { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--chip) }
.rule.new { background: var(--ok-bg) }
.rule.rej { text-decoration: line-through; text-decoration-color: var(--bad); color: var(--muted) }
table.jt { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums }
.jt th, .jt td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left }
.jt th { font-weight: 500; color: var(--muted); font-size: 12px }
.jt td.c { text-align: center }
.v-h { color: var(--ok); font-weight: 600 } .v-q { color: var(--bad); font-weight: 600 } .v-e { color: var(--muted) }
.quote { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin-top: 8px }
.quote b { color: var(--ink); font-weight: 600 }
.marks { display: inline-flex; gap: 3px }
.mk { width: 22px; text-align: center; border-radius: 4px; font-size: 12px; font-weight: 600 }
.mk.w { background: var(--ok-bg); color: var(--ok) } .mk.l { background: var(--bad-bg); color: var(--bad) } .mk.t { background: var(--chip); color: var(--muted) }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.prob { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 2px 8px; font-size: 13px }
.prob .id { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 1px }
.prob.tgt .id { color: var(--accent); font-weight: 600 }
.prob .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted) }
.small { font-size: 12px; color: var(--muted) }
.log { width: 100%; border-collapse: collapse; font-size: 13px }
.log th, .log td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
.log th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap }
.log tr { cursor: pointer } .log tr:hover td { background: var(--chip) }
.scroll { overflow-x: auto }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 13px }
.stats b { font-size: 20px; font-weight: 650; margin-right: 4px; font-variant-numeric: tabular-nums }

/* The generated report page. It is a screenshot-like object: always light, its own fixed palette. */
.rp { background: #ffffff; color: #1f2328; font-family: var(--sans); font-size: 13px; line-height: 1.6; padding: 22px 22px 40px }
.rp p { margin: 0 }
.rp h1 { margin: 0 } .rp h2 { margin: 0 } .rp h3 { margin: 0 }
.rp.box { background: #eef0f4 }
.rp.box .sec { background: #ffffff; border: 1px solid #d3d8df; border-radius: 10px; box-shadow: 0 2px 8px rgba(20, 30, 50, .10); padding: 14px 16px }
.rp.open .sec { border-top: 1px solid #e3e6ea; padding-top: 16px }
.rp.flat h1 { font-size: 15px; font-weight: 600 } .rp.flat h2 { font-size: 13.5px; font-weight: 600; margin-bottom: 8px } .rp.flat .note { font-size: 12.5px; color: #2b3038 }
.rp.scale h1 { font-size: 20px; font-weight: 650 } .rp.scale h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px } .rp.scale .note { font-size: 11px; color: #6b7280 }
.rp.sp-tight .sec { padding-top: 6px } .rp.sp-tight h2 { margin-bottom: 3px } .rp.sp-tight.box .sec { padding: 6px 10px }
.rp.sp-even .sec > * + * { margin-top: 16px } .rp.sp-even h2 + * { margin-top: 0 }
.rp .sec.chg { outline: 2px dashed var(--rp-mark); outline-offset: 5px; border-radius: 4px; position: relative }
.rp .sec.chg::after { content: "改动处"; position: absolute; top: -14px; right: 0; font-size: 11px; background: var(--rp-mark); color: #ffffff; padding: 0 6px; border-radius: 3px }
.rp ul { margin: 0; padding-left: 18px } .rp ol { margin: 0; padding-left: 20px }
.rp li + li { margin-top: 3px }
.rp table { border-collapse: collapse; width: 100%; color: inherit; font-size: inherit }
.rp th, .rp td { padding: 5px 8px; border-bottom: 1px solid #e5e7eb; text-align: left; white-space: nowrap }
.rp th { font-weight: 600; font-size: 12px; color: #4b5563 }
.rp .tw { overflow-x: auto }
.rp caption { caption-side: bottom; padding-top: 8px; text-align: center; font-size: 12px; color: #6b7280 }
.rp.k1 caption { text-align: left }
.rp.k1 .num { text-align: right; font-variant-numeric: tabular-nums }
.rp .mx td.m { text-align: center }
.rp .y { color: #16a34a; font-weight: 700 } .rp .x { color: #dc2626; font-weight: 700 } .rp .pt { color: #e08a00; font-size: 12px; font-weight: 600 }
.rp .sym { display: inline-block; vertical-align: -1px }
.rp .pd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px }
.rp .lg { display: flex; justify-content: flex-end; gap: 12px; font-size: 12px; color: #4b5563; margin-top: 4px }
.rp svg { width: 100%; height: auto; display: block }
.rp svg text { font-size: 11px; fill: #6b7280; font-family: var(--sans) }
.rp .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.rp .card { border: 1px solid #dfe3e8; border-radius: 8px; padding: 10px 12px; background: #ffffff }
.rp .card h3 { font-size: 13.5px; font-weight: 600; margin-bottom: 6px }
.rp .card p + p { margin-top: 3px }
.rp .card dl { display: grid; grid-template-columns: 4.6em minmax(0, 1fr); gap: 4px 8px; margin: 0 }
.rp .card dt { color: #6b7280; font-size: 12px } .rp .card dd { margin: 0 }
.rp .ic { display: inline-block; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 4px; background: #eef1f5; color: #4b5563; font-size: 11px; margin-right: 5px }
.rp .grp + .grp { margin-top: 12px }
.rp .grp h3 { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 4px }
</style>

<div class="wrap">
  <header class="top">
    <h1>竞品分析 Skill 的输出层迭代<span class="tag">模拟数据演示</span></h1>
    <p>同一份竞品分析报告页，经过 10 轮自动迭代，从初版 g0 改到最终版。每一轮由审美 judge 找问题，Maintainer 归类：布局问题交 Reviser 改输出指南，组件问题交组件 Agent 并由人审批；候选版要过门禁才采用，记录员给每一轮写成功、失败或没效果。数据和产品名均为虚构。</p>
  </header>

  <section class="panel track" aria-label="迭代轨迹">
    <div class="flow" id="flow"></div>
    <div class="chips" id="chips" role="tablist"></div>
    <div class="chart" id="chart"></div>
    <div class="legend">
      <span><i class="dot d-ok"></i>成功，采用</span>
      <span><i class="dot d-bad"></i>失败，未采用</span>
      <span><i class="dot d-meh"></i>没效果，未采用</span>
      <span>纵轴：训练页上还没解决的审美问题数</span>
    </div>
  </section>

  <section id="detail" style="display:grid;gap:14px"></section>

  <section class="panel">
    <h3>修改记录（记录员）<span class="small">点一行查看那一轮</span></h3>
    <div class="scroll"><table class="log" id="log"></table></div>
  </section>
</div>

<script>
const PRODUCTS = ["云笺", "墨格", "简页", "拾光"]
const PAL = {
  rainbow: { 云笺: "#e4572e", 墨格: "#17bebb", 简页: "#f2b300", 拾光: "#76b041" },
  grey: { 云笺: "#2f5bd3", 墨格: "#9aa1ab", 简页: "#9aa1ab", 拾光: "#9aa1ab" },
  tonal: { 云笺: "#2f5bd3", 墨格: "#3d4450", 简页: "#6f7782", 拾光: "#a3aab4" },
}
const DASH = { 云笺: "", 墨格: "", 简页: "5 3", 拾光: "2 3" }
const HEADS = ["#e4572e", "#17bebb", "#d99a00", "#5e9c2f", "#8f5bd6", "#e4572e"]
const FEAT = [["实时协作", "f", "f", "f", "f"], ["离线编辑", "n", "n", "f", "n"], ["模板市场", "f", "p", "f", "p"], ["细粒度权限", "f", "n", "p", "p"], ["AI 摘要", "p", "n", "p", "f"], ["开放 API", "p", "p", "n", "f"]]
const PRICE = [["云笺", "30", "820", "+6.2%"], ["墨格", "18", "640", "+18.4%"], ["简页", "45", "310", "+3.1%"], ["拾光", "38", "155", "−2.7%"]]
const TREND = { 云笺: [760, 772, 785, 798, 810, 820], 墨格: [520, 545, 571, 598, 620, 640], 简页: [300, 302, 305, 306, 309, 310], 拾光: [170, 166, 163, 160, 158, 155] }
const CARD = {
  墨格: { 定价: "18 元/人/月", 用户规模: "640 万月活", 优势: "价格低，近两季度增长最快", 短板: "权限只到文档级，模板少" },
  简页: { 定价: "45 元/人/月", 用户规模: "310 万月活", 优势: "排版精致，支持离线编辑", 短板: "价格最高，多人同时编辑会卡顿" },
  拾光: { 定价: "38 元/人/月", 用户规模: "155 万月活", 优势: "AI 摘要上线早，开放 API 完整", 短板: "月活连续下滑，模板市场小" },
}
const MIXED = {
  墨格: { order: ["优势", "定价", "短板", "用户规模"], rename: {} },
  简页: { order: ["定价", "用户规模", "优势", "短板"], rename: { 定价: "价格", 用户规模: "规模" } },
  拾光: { order: ["短板", "优势", "用户规模", "定价"], rename: { 用户规模: "MAU" }, list: true },
}
const ICON = { 定价: "¥", 用户规模: "◎", 优势: "+", 短板: "−" }
const SHORT = ["上线离线编辑基础版，补上和简页的差距", "模板市场增加 20 个行业模板，巩固领先", "面向 50 人以下团队推出年付八折，回应墨格的低价", "在权限设置页加新手引导，降低管理员上手成本"]
const LONG = ["把 AI 摘要从单篇文档扩展到整个知识库", "开放 API 补齐 Webhook，吸引集成伙伴", "评估面向大型企业的私有化部署"]
const FLAT = [LONG[0], SHORT[0], SHORT[2], LONG[2], SHORT[1], LONG[1], SHORT[3]]

// Each version of the page is a set of design choices; the guide rules and the component fix change them.
const g0 = { c: "box", t: "flat", col: "rainbow", k: 0, s: "uneven", card: "mixed", rec: "flat" }
const V = { g0 }
V.g1 = { ...V.g0, c: "open" }
V.g2 = { ...V.g1, t: "scale" }
V.c3 = { ...V.g2, col: "grey" }
V.g3 = { ...V.g2, col: "tonal" }
V.g3k = { ...V.g3, k: 1 }
V.c6 = { ...V.g3k, s: "tight" }
V.g4 = { ...V.g3k, s: "even" }
V.c8 = { ...V.g4, card: "icons" }
V.g5 = { ...V.g4, card: "fixed" }
V.g6 = { ...V.g5, rec: "grouped" }
const ALL = ["sum", "matrix", "price", "trend", "cards", "recs"]

function trendSVG(col) {
  const pal = PAL[col], W = 520, H = 210, x0 = 40, x1 = col === "tonal" ? 440 : 500, y0 = 180, y1 = 16
  const X = (i) => x0 + (i * (x1 - x0)) / 5, Y = (v) => y0 - ((v - 100) / 800) * (y0 - y1)
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="四个产品 4 到 9 月月活趋势">`
  for (const g of [100, 300, 500, 700, 900]) s += `<line x1="${x0}" x2="${x1}" y1="${Y(g)}" y2="${Y(g)}" stroke="#eceef1" stroke-width="1"/><text x="${x0 - 6}" y="${Y(g) + 4}" text-anchor="end">${g}</text>`
  ;["4月", "5月", "6月", "7月", "8月", "9月"].forEach((m, i) => (s += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${m}</text>`))
  for (const p of PRODUCTS) {
    const pts = TREND[p].map((v, i) => `${X(i)},${Y(v)}`).join(" ")
    const w = p === "云笺" && col !== "rainbow" ? 2.6 : col === "rainbow" ? 2.6 : 1.8
    s += `<polyline points="${pts}" fill="none" stroke="${pal[p]}" stroke-width="${w}" ${col === "tonal" && DASH[p] ? `stroke-dasharray="${DASH[p]}"` : ""} stroke-linejoin="round"/>`
    if (col === "tonal") s += `<text x="${X(5) + 8}" y="${Y(TREND[p][5]) + 4}" style="fill:${pal[p]};font-weight:${p === "云笺" ? 600 : 400}">${p} ${TREND[p][5]}</text>`
  }
  s += `<text x="${x0}" y="10" text-anchor="start">万</text></svg>`
  if (col !== "tonal") s += `<div class="lg">${PRODUCTS.map((p) => `<span><i class="pd" style="background:${pal[p]};border-radius:2px"></i>${p}</span>`).join("")}</div>`
  return s
}

// Matrix marks after k1: filled, half and hollow circles, drawn so every font shows them alike.
const sym = (m) => `<svg class="sym" width="11" height="11" viewBox="0 0 12 12" aria-label="${{ f: "支持", p: "部分支持", n: "不支持" }[m]}"><circle cx="6" cy="6" r="5" fill="${m === "f" ? "#3a4250" : "#ffffff"}" stroke="#3a4250" stroke-width="1.4"/>${m === "p" ? '<path d="M6 1 A5 5 0 0 0 6 11 Z" fill="#3a4250"/>' : ""}</svg>`
function report(v, focus) {
  const pal = PAL[v.col]
  const gaps = { uneven: [20, 24, 56, 16, 40, 20], tight: [10, 8, 8, 8, 8, 8], even: [32, 40, 40, 40, 40, 40] }[v.s]
  const name = (p) => `<i class="pd" style="background:${pal[p]}"></i>${p}${p === "云笺" ? "（我方）" : ""}`
  const mark = (m) => v.k ? sym(m) : m === "f" ? `<span class="y">✓</span>` : m === "n" ? `<span class="x">✗</span>` : `<span class="pt">部分</span>`
  const num = v.k ? ' class="num"' : ""
  const card = (p) => {
    const d = CARD[p]
    if (v.card === "fixed") return `<div class="card"><h3>${name(p)}</h3><dl>${["定价", "用户规模", "优势", "短板"].map((f) => `<dt>${f}</dt><dd>${d[f]}</dd>`).join("")}</dl></div>`
    const m = MIXED[p], lab = (f) => `${v.card === "icons" ? `<span class="ic">${ICON[f]}</span>` : ""}<b>${m.rename[f] ?? f}</b>：${d[f]}`
    return `<div class="card"><h3>${name(p)}</h3>${m.list ? `<ul>${m.order.map((f) => `<li>${lab(f)}</li>`).join("")}</ul>` : m.order.map((f) => `<p>${lab(f)}</p>`).join("")}</div>`
  }
  const secs = [
    ["sum", "结论摘要", `<ul><li>云笺在模板市场和权限两项领先，离线编辑仍然缺失。</li><li>墨格以低价换增长，近两季度月活增速最高（+18.4%）。</li><li>简页和拾光定位中高端，价格比云笺高 25% 以上。</li></ul>`],

function flow(r) {
  const on = (k) => (r ? (k === "comp" ? r.kind === "组件" : k === "rev" ? r.kind === "布局" : k === "gate" ? r.kind === "布局" : k === "human" ? r.kind === "组件" : true) : false)
  const st = (k, t) => `<span class="step ${on(k) ? "on" : ""}">${t}</span>`
  $("#flow").innerHTML = `${flowSteps.map(([k, t]) => st(k, t)).join('<span class="arr">→</span>')}<span class="arr">→</span><span class="fork">${st("rev", "布局问题 → Reviser 改输出指南")}${st("comp", "组件不够 → 组件 Agent")}</span><span class="arr">→</span><span class="fork">${st("gate", "门禁：留出页 3 轮")}${st("human", "人工审批")}</span><span class="arr">→</span>${st("rec", "记录员")}`
}

function chart(sel) {
  const W = 680, H = 150, x0 = 34, x1 = 660, y0 = 118, y1 = 14
  const X = (i) => x0 + (i * (x1 - x0)) / 10, Y = (v) => y0 - (v / 6) * (y0 - y1)
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每轮之后还没解决的问题数">`
  for (const g of [0, 2, 4, 6]) s += `<line x1="${x0}" x2="${x1}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${x0 - 8}" y="${Y(g) + 4}" text-anchor="end">${g}</text>`
  s += `<polyline points="${OPEN.map((v, i) => `${X(i)},${Y(v)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`
  s += `<text x="${X(4) + 8}" y="${Y(5) - 8}" text-anchor="start">+2 个组件问题</text>`
  OPEN.forEach((v, i) => {
    const r = R[i - 1], cls = i === 0 ? "var(--muted)" : `var(--${resCls(r)})`, isSel = (i === 0 && sel === "g0") || (r && r.id === sel)
    s += `<g style="cursor:pointer" data-go="${i === 0 ? "g0" : r.id}">${isSel ? `<circle cx="${X(i)}" cy="${Y(v)}" r="9" fill="none" stroke="${cls}" stroke-width="1.5"/>` : ""}<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${cls}"/><text x="${X(i)}" y="${H - 8}" text-anchor="middle">${i === 0 ? "g0" : r.id}</text></g>`
  })
  $("#chart").innerHTML = s + "</svg>"
  $("#chart").querySelectorAll("[data-go]").forEach((g) => g.addEventListener("click", () => go(g.dataset.go)))
}

function chips(sel) {
  const list = [{ id: "g0", t: "g0 初版", c: "base" }, ...R.map((r) => ({ id: r.id, t: `${r.n} · ${r.id}`, c: resCls(r) })), { id: "final", t: "最终对比", c: "base" }]
  $("#chips").innerHTML = list.map((x) => `<button class="chip ${x.id === sel ? "sel" : ""}" role="tab" aria-selected="${x.id === sel}" data-go="${x.id}"><i class="dot d-${x.c}"></i>${x.t}</button>`).join("")
  $("#chips").querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)))
}

  const rows = CRIT.map((k, i) => {
    const a = r.j.o1[i], b = r.j.o2[i], agree = a === b && a !== "-"
    return `<tr><td>${k}</td>${vcell(a)}${vcell(b)}<td class="c">${agree ? (a === "h" ? '<span class="v-h">改后更好</span>' : '<span class="v-q">改前更好</span>') : a !== b ? '<span class="v-e">不一致</span>' : ""}</td></tr>`
  }).join("")
  const tr = [...r.j.train].map((x, i) => `<span><span class="mk ${x === "后" ? "w" : x === "前" ? "l" : "t"}">${x}</span> ${TRAIN[i]}</span>`).join("")
  return `<div class="panel"><h3>审美 judge · 训练页</h3><div class="scroll"><table class="jt"><thead><tr><th>标准</th><th class="c">改动前先给</th><th class="c">改动后先给</th><th class="c">算数</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="quote"><b>改动前先给：</b>${r.j.r1}</p><p class="quote"><b>改动后先给：</b>${r.j.r2}</p>
  <p class="label" style="margin-top:12px">4 个训练页（两种顺序一致才算）</p><div style="display:grid;gap:4px;font-size:13px;margin-top:4px">${tr}</div></div>`
}
function gatePanel(r) {
  if (r.approval) return `<div class="panel"><h3>${r.approval.by}<span class="pill p-ok">${r.approval.decision}</span></h3><p style="font-size:13px">${r.approval.note}</p><p class="small" style="margin-top:8px">组件改动不过门禁，由人看示例页后决定。</p></div>`
  const m = (s) => `<span class="marks">${[...s].map((x) => `<span class="mk ${x === "赢" ? "w" : x === "输" ? "l" : "t"}">${x}</span>`).join("")}</span>`
  return `<div class="panel"><h3>门禁 · 留出页<span class="pill ${r.accept ? "p-ok" : "p-bad"}">${r.accept ? "采用" : "未采用"}</span></h3>
  <div style="display:grid;gap:6px;font-size:13px"><div>${m(r.gate.h1)}　h1 在线会议产品竞品</div><div>${m(r.gate.h2)}　h2 记账 App 竞品</div><div>程序检查问题：${r.gate.prog}</div></div>
  <p class="small" style="margin-top:10px">候选版对当前版，每页比 3 轮。采用条件：没有一页输、至少赢一半、程序检查不变差。</p>${r.gate.why ? `<p style="margin-top:8px;font-size:13px;color:var(--bad)">${r.gate.why}</p>` : ""}</div>`
}
function recPanel(r) {
  const c = r.rec, cls = c.result === "成功" ? "p-ok" : c.result === "失败" ? "p-bad" : "p-meh"
  const li = (a) => (a.length ? a.join("；") : "无")
  return `<div class="panel"><h3>记录员<span class="pill ${cls}">${c.result}</span></h3><dl class="kv"><dt>做法</dt><dd>${c.practice}</dd><dt>解决了</dt><dd>${li(c.solved)}</dd><dt>带出的问题</dt><dd>${li(c.broke)}</dd>${c.note ? `<dt>说明</dt><dd>${c.note}</dd>` : ""}<dt>教训</dt><dd>${c.lesson}</dd></dl></div>`
}
function problemPanel(n, r) {
  const ids = Object.keys(PROB).filter((p) => (PROB[p].from ?? 0) < n && SOLVED[p] >= n)
  const done = Object.keys(PROB).filter((p) => SOLVED[p] < n)
  const status = (p) => (r.g0 ? `<span class="pill p-base">待解决</span>` : SOLVED[p] === n ? `<span class="pill p-ok">本轮解决</span>` : r.tg.includes(p) ? `<span class="pill p-bad">本轮没解决</span>` : `<span class="pill p-base">待解决</span>`)
  return `<div class="panel"><h3>问题清单 · 本轮开始时<span class="small">${ids.length} 个未解决</span></h3><ul class="plain">${ids.map((p) => `<li class="prob ${r.tg.includes(p) ? "tgt" : ""}"><span class="id">${p}</span><span>${PROB[p].text}</span><span class="meta"><span>${PROB[p].crit}</span>·<span>${PROB[p].cause}</span>${PROB[p].from === n - 1 ? "<span>· 上一轮后新出现</span>" : ""}${status(p)}</span></li>`).join("")}</ul>${done.length ? `<p class="small" style="margin-top:10px">已解决：${done.map((p) => `${p}（${R[SOLVED[p] - 1].id}）`).join("、")}</p>` : ""}</div>`
}
function changePanel(r) {
  if (r.kind === "组件") return `<div class="panel"><h3>组件 Agent · 提案 k1<span class="small">针对 ${r.tg.join("、")}</span></h3><p class="rule new">${r.comp}</p></div>`
  const g = GUIDE.find((x) => x.id === r.rule)
  return `<div class="panel"><h3>Reviser · 改输出指南<span class="small">针对 ${r.tg.join("、")}</span></h3><p class="label">${r.accept ? `新增规则 ${g.id}` : "候选规则（未采用）"}</p><p class="rule ${r.accept ? "new" : "rej"}" style="margin-top:4px">${r.accept ? g.text : r.ruleText}</p>${r.n > 1 ? `<p class="small" style="margin-top:8px">Reviser 先读了修改记录：${R.slice(0, r.n - 1).filter((x) => !x.accept).map((x) => `${x.id} ${x.rec.result}`).join("、") || "此前没有失败的做法"}${R.slice(0, r.n - 1).some((x) => !x.accept && x.tg.some((t) => r.tg.includes(t))) ? "，这次换了做法" : ""}。</p>` : ""}</div>`
}
function guidePanel(n) {
  const rules = GUIDE.filter((g) => g.at <= n), comp = n >= 5
  return `<div class="panel"><h3>本轮之后的输出指南<span class="small">${rules.length} 条规则${comp ? " · 组件库含 k1" : ""}</span></h3>${rules.length ? `<ul class="plain">${rules.map((g) => `<li class="prob ${g.at === n ? "tgt" : ""}"><span class="id">${g.id}</span><span>${g.text}</span></li>`).join("")}</ul>` : `<p class="small">还没有规则。</p>`}</div>`
}

function frames(lv, lt, rv, rt, focus) {
  return `<div class="frames"><div class="frame"><div class="cap"><span>改动前 · <b>${lt}</b></span></div><div class="viewport" data-sync>${report(V[lv], [])}</div></div><div class="frame"><div class="cap"><span>改动后 · <b>${rt}</b></span><span>虚线框为改动处</span></div><div class="viewport" data-sync>${report(V[rv], focus)}</div></div></div>`
}
let lock = false
function sync() {
  const vs = [...document.querySelectorAll("[data-sync]")]
  vs.forEach((v) => v.addEventListener("scroll", () => {
    if (lock) return
    lock = true
    const f = v.scrollTop / Math.max(1, v.scrollHeight - v.clientHeight)
    vs.forEach((o) => { if (o !== v) o.scrollTop = f * (o.scrollHeight - o.clientHeight) })
    requestAnimationFrame(() => (lock = false))
  }))
}
function scrollToFocus(focus) {
  if (!focus || focus === ALL) return
  const vs = [...document.querySelectorAll("[data-sync]")]
  const after = vs[1], s = after && after.querySelector(`[data-id="${focus[0]}"]`)
  if (!s) return
  lock = true
  setTimeout(() => (lock = false), 100)
  const top = s.getBoundingClientRect().top - after.getBoundingClientRect().top + after.scrollTop - 24
  vs.forEach((v) => (v.scrollTop = top))
}

function go(id) {
  let html = "", r = R.find((x) => x.id === id)
  const idx = id === "g0" ? 0 : id === "final" ? 11 : r.n
  const nav = `<div class="nav"><button data-step="-1" ${idx === 0 ? "disabled" : ""}>上一轮</button><button data-step="1" ${idx === 11 ? "disabled" : ""}>下一轮</button></div>`
  if (id === "g0") {
    flow(null)
    html = `<div class="head"><div><h2>g0 · 初版</h2><p class="sub">按空白输出指南生成的页面。审美 judge 拿它和同一指南再生成的一版比，Maintainer 列出 6 个问题。</p></div>${nav}</div>
    ${frames("g0", "g0", "g0", "g0", [])}<div class="grid">${problemPanel(1, { tg: [], g0: true })}${guidePanel(0)}</div>`
  } else if (id === "final") {
    flow(null)
    const acc = R.filter((x) => x.accept).length, fail = R.filter((x) => x.rec.result === "失败").length, meh = R.filter((x) => x.rec.result === "没效果").length
    html = `<div class="head"><div><h2>最终对比 · g0 和 g6 + k1</h2><p class="sub">问题清单清空后 loop 停止。</p></div>${nav}</div>
    <div class="panel stats"><span><b>10</b>轮迭代</span><span><b style="color:var(--ok)">${acc}</b>次成功并采用</span><span><b style="color:var(--bad)">${fail}</b>次失败</span><span><b style="color:var(--meh)">${meh}</b>次没效果</span><span><b>6</b>条输出指南规则</span><span><b>1</b>次组件修改（人工审批）</span><span><b>8</b>个问题全部解决</span></div>
    ${frames("g0", "g0 初版", "g6", "g6 + k1 最终版", [])}<div class="grid">${guidePanel(10)}</div>`
  } else {
    flow(r)
    const cls = resCls(r)
    html = `<div class="head"><div><h2>第 ${r.n} 轮 · ${r.id} <span class="pill p-${cls}">${r.rec.result} · ${r.accept ? "采用" : "未采用"}</span></h2><p class="sub">${r.kind === "组件" ? "组件不够 → 组件 Agent" : "布局问题 → Reviser"} · 针对 ${r.tg.map((t) => `${t} ${PROB[t].crit}`).join("、")} · 基于 ${r.bl}${r.ver ? ` · 采用后成为 ${r.ver}` : ""}</p></div>${nav}</div>
    ${frames(r.base, r.bl, r.cand, `${r.cl}${r.accept ? "" : "（未采用）"}`, r.focus)}
    <div class="grid">${changePanel(r)}${judgePanel(r)}${gatePanel(r)}${recPanel(r)}${problemPanel(r.n, r)}${guidePanel(r.accept ? r.n : r.n - 1)}</div>
    ${r.after ? `<div class="panel" style="font-size:13px"><span class="label">本轮之后</span><p style="margin-top:4px">${r.after}</p></div>` : ""}`
  }
  $("#detail").innerHTML = html
  $("#detail").querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => {
    const order = ["g0", ...R.map((x) => x.id), "final"]
    go(order[order.indexOf(id) + Number(b.dataset.step)])
  }))
  chips(id)
  chart(id)
  sync()
  requestAnimationFrame(() => scrollToFocus(r?.focus))
  try { history.replaceState(null, "", `#${id}`) } catch (e) {}
}

function log() {
  $("#log").innerHTML = `<thead><tr><th>轮</th><th>改动</th><th>针对</th><th>结论</th><th>门禁 / 审批</th><th>教训</th></tr></thead><tbody>${R.map((r) => `<tr data-go="${r.id}"><td style="white-space:nowrap">${r.n} · ${r.id}</td><td>${r.rec.practice}</td><td style="white-space:nowrap">${r.tg.join("、")}</td><td><span class="pill p-${resCls(r)}">${r.rec.result}</span></td><td style="white-space:nowrap">${r.approval ? "人工审批采用" : r.accept ? "采用" : "未采用"}</td><td>${r.rec.lesson}</td></tr>`).join("")}</tbody>`
  $("#log").querySelectorAll("[data-go]").forEach((t) => t.addEventListener("click", () => { go(t.dataset.go); $("#detail").scrollIntoView({ block: "start" }) }))
}

document.addEventListener("keydown", (e) => {
  if (e.target.closest("input,textarea")) return
  const order = ["g0", ...R.map((x) => x.id), "final"], cur = document.querySelector(".chip.sel")?.dataset.go
  const i = order.indexOf(cur)
  if (e.key === "ArrowRight" && i < order.length - 1) go(order[i + 1])
  if (e.key === "ArrowLeft" && i > 0) go(order[i - 1])
})

log()
const start = location.hash.slice(1)
go(["g0", "final", ...R.map((x) => x.id)].includes(start) ? start : "c1")
</script>
