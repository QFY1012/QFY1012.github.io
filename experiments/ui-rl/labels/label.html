<title>页面对盲标</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --fg: #1d2129; --dim: #5f6673; --line: #dfe2e8;
    --accent: #c2410c; --accent-soft: #fbe9df; --ok: #2f7d4f; --chip: #eef0f4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171b; --panel: #1e2126; --fg: #e8eaee; --dim: #9aa1ad; --line: #30343b;
      --accent: #f08a4b; --accent-soft: #3a2619; --ok: #6cc28f; --chip: #2a2e35; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171b; --panel: #1e2126; --fg: #e8eaee; --dim: #9aa1ad; --line: #30343b;
    --accent: #f08a4b; --accent-soft: #3a2619; --ok: #6cc28f; --chip: #2a2e35; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; }
  .meta { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; min-width: 120px; height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
  .round { display: flex; gap: 4px; }
  button {
    font: inherit; color: var(--fg); background: var(--chip); border: 1px solid transparent;
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--line); }
  button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .warn { color: var(--accent); font-size: 13px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 16px; }
  .side { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .side .tag { font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; }
  .scroll { flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); }
  .scroll img { display: block; width: 100%; height: auto; }
  .tabs { display: none; gap: 4px; padding: 8px 16px 0; }
  footer {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--panel);
  }
  .scale { display: flex; gap: 6px; flex-wrap: wrap; }
  .scale button { min-width: 84px; }
  .scale kbd, .nav kbd { font: 11px ui-monospace, monospace; color: var(--dim); margin-left: 4px; }
  #reason {
    flex: 1; min-width: 180px; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  }
  .nav { display: flex; gap: 6px; }
  .saved { font-size: 13px; color: var(--ok); min-width: 4em; }
  .note { padding: 24px 16px; color: var(--dim); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    main .side { display: none; }
    main .side.show { display: flex; }
    .tabs { display: flex; }
    .scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); width: 100%; gap: 4px; }
    .scale button { min-width: 0; padding: 6px 2px; font-size: 12px; }
    .scale kbd, .nav kbd { display: none; }
    .nav { width: 100%; }
    .nav button { flex: 1; }
  }
</style>

<header>
  <h1>页面对盲标</h1>
  <span class="meta" id="pos">—</span>
  <div class="bar"><i id="prog"></i></div>
  <span class="meta" id="done">—</span>
  <div class="round" role="group" aria-label="轮次">
    <button id="r1" class="on">第 1 轮 · 84 对</button>
    <button id="r2">重标 · 21 对</button>
  </div>
  <label class="meta"><input type="checkbox" id="sync" checked> 两边同步滚动</label>
  <span class="warn" id="store"></span>
</header>

<div class="tabs" role="group" aria-label="看哪一版">
  <button id="tabL" class="on">左边这版</button>
  <button id="tabR">右边这版</button>
</div>

<main id="main">
  <section class="side show" id="sideL"><div class="tag"><b>左</b><span id="hL"></span></div><div class="scroll" id="sL"><img id="imgL" alt="左边这版的整页截图"></div></section>
  <section class="side" id="sideR"><div class="tag"><b>右</b><span id="hR"></span></div><div class="scroll" id="sR"><img id="imgR" alt="右边这版的整页截图"></div></section>
</main>

<footer>
  <div class="scale" role="group" aria-label="哪边设计更好">
    <button data-v="-2">左明显更好<kbd>1</kbd></button>
    <button data-v="-1">左稍好<kbd>2</kbd></button>
    <button data-v="0">差不多<kbd>3</kbd></button>
    <button data-v="1">右稍好<kbd>4</kbd></button>
    <button data-v="2">右明显更好<kbd>5</kbd></button>
  </div>
  <input id="reason" placeholder="理由（可选，一句话，比如「右边截图下的说明对齐了」）">
  <div class="nav">
    <button id="prev">上一对<kbd>←</kbd></button>
    <button id="next">下一对<kbd>→</kbd></button>
    <button id="skip">下一个没标的</button>
  </div>
  <span class="saved" id="saved"></span>
</footer>

<script>
(async () => {
  // 标注存在 artifact 的 db 里(labels/<轮>-<编号>),Claude 读得到;db 不可用时退回浏览器本地存储。
  // score 一律以 pairs.json 里的左右为准:正数 = pairs.json 的右边更好。重标轮把左右对调显示,存的时候换算回来。
  const $ = (id) => document.getElementById(id);
  let pairs = [];
  try { pairs = await (await fetch('pairs.json')).json(); }
  catch { document.querySelector('main').outerHTML = '<p class="note">读不到 pairs.json,页面对没有加载。</p>'; return; }

  const RE = pairs.filter((_, i) => i % 4 === 1);           // 重标:每 4 对取 1 对,共 21 对
  const reOrder = [...RE].reverse();                           // 顺序也换掉
  let round = 'r1', list = pairs, idx = 0;
  const labels = {};                                           // key `${round}-${id}` -> doc
  const key = (r, id) => `${r}-${id}`;
  const swapped = () => round === 'r2';

  // ---- 存储 ----
  let db = null, local = false;
  const loadLocal = () => { try { return JSON.parse(localStorage.getItem('pair-labels') || '{}'); } catch { return {}; } };
  const saveLocal = () => { try { localStorage.setItem('pair-labels', JSON.stringify(labels)); } catch {} };
  const useLocal = () => {
    local = true;
    Object.assign(labels, loadLocal());
    $('store').textContent = '标注只存在这个浏览器里，标完请告诉 Claude 换个方式导出';
    render();
  };
  const use = window.claude?.use ? window.claude.use('db') : Promise.resolve(null);
  use.then((d) => {
    if (!d) return useLocal();
    db = d;
    db.collection('labels').onSnapshot((snap) => {
      for (const doc of snap.docs) labels[doc.id] = doc.data();
      render();
    }, () => useLocal());
  }).catch(useLocal);

  async function save(v) {
    const p = list[idx];
    const shownRightBetter = v;                                 // 显示时的「右边更好」
    const score = swapped() ? -shownRightBetter : shownRightBetter;
    const doc = { pair: p.id, round, score, reason: $('reason').value.trim(), shownSwapped: swapped(), at: new Date().toISOString() };
    labels[key(round, p.id)] = doc;
    render();
    $('saved').textContent = '保存中…';
    try {
      if (db) await db.collection('labels').doc(key(round, p.id)).set(doc);
      else saveLocal();
      $('saved').textContent = '已保存';
    } catch (e) {
      saveLocal();
      $('saved').textContent = '存到本地了';
    }
    setTimeout(() => go(1), 250);
  }

  // ---- 显示 ----
  function render() {
    if (!list.length) return;
    const p = list[idx];
    const [l, r] = swapped() ? [p.right, p.left] : [p.left, p.right];
    if ($('imgL').getAttribute('src') !== l) { $('imgL').src = 'pages/' + l; $('sL').scrollTop = 0; }
    if ($('imgR').getAttribute('src') !== r) { $('imgR').src = 'pages/' + r; $('sR').scrollTop = 0; }
    const n = list.filter((q) => labels[key(round, q.id)]).length;
    $('pos').textContent = `第 ${idx + 1} / ${list.length} 对 · ${p.id}`;
    $('done').textContent = `已标 ${n}`;
    $('prog').style.width = (n / list.length * 100) + '%';
    const cur = labels[key(round, p.id)];
    const shown = cur ? (swapped() ? -cur.score : cur.score) : null;
    document.querySelectorAll('.scale button').forEach((b) => b.classList.toggle('on', shown !== null && Number(b.dataset.v) === shown));
    if (document.activeElement !== $('reason')) $('reason').value = cur?.reason ?? '';
    // 预取下一对
    const q = list[idx + 1];
    if (q) for (const f of [q.left, q.right]) { const im = new Image(); im.src = 'pages/' + f; }
  }
  function go(d) { idx = Math.max(0, Math.min(list.length - 1, idx + d)); $('saved').textContent = ''; render(); }
  function firstOpen() { const i = list.findIndex((q) => !labels[key(round, q.id)]); return i < 0 ? idx : i; }

  document.querySelectorAll('.scale button').forEach((b) => b.addEventListener('click', () => save(Number(b.dataset.v))));
  $('prev').onclick = () => go(-1);
  $('next').onclick = () => go(1);
  $('skip').onclick = () => { idx = firstOpen(); render(); };
  const setRound = (r) => {
    round = r; list = r === 'r1' ? pairs : reOrder; idx = firstOpen();
    $('r1').classList.toggle('on', r === 'r1'); $('r2').classList.toggle('on', r === 'r2');
    render();
  };
  $('r1').onclick = () => setRound('r1');
  $('r2').onclick = () => setRound('r2');
  $('tabL').onclick = () => { $('sideL').classList.add('show'); $('sideR').classList.remove('show'); $('tabL').classList.add('on'); $('tabR').classList.remove('on'); };
  $('tabR').onclick = () => { $('sideR').classList.add('show'); $('sideL').classList.remove('show'); $('tabR').classList.add('on'); $('tabL').classList.remove('on'); };

  // 同步滚动:按像素对齐(两版开头通常相同,改动处才错开)
  let lock = false;
  const follow = (from, to) => from.addEventListener('scroll', () => {
    if (!$('sync').checked || lock) return;
    lock = true; to.scrollTop = from.scrollTop; requestAnimationFrame(() => { lock = false; });
  });
  follow($('sL'), $('sR')); follow($('sR'), $('sL'));

  document.addEventListener('keydown', (e) => {
    if (e.target === $('reason')) { if (e.key === 'Enter') $('reason').blur(); return; }
    const m = { '1': -2, '2': -1, '3': 0, '4': 1, '5': 2 }[e.key];
    if (m !== undefined) save(m);
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  });

  render();
  try { const s = localStorage.getItem('pair-labels-round'); if (s === 'r2') setRound('r2'); } catch {}
  addEventListener('beforeunload', () => { try { localStorage.setItem('pair-labels-round', round); } catch {} });
})();
</script>
