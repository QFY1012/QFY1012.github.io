<script>
/* ============================================================ utilities */
const W = 1920, H = 1080, FPS = 60;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const oQ = x => 1 - Math.pow(1 - x, 4);
const oC = x => 1 - Math.pow(1 - x, 3);
const ioC = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const oB = (x, s = 1.2) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6d2b79f5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || document.body).appendChild(e); return e; };
const NS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const st = (e, o) => { for (const k in o) e.style[k] = o[k]; };

/* ============================================================ timeline — paced by reading
   Scene code is authored on a compact "animation clock": 背景 at STEP[0], 解法 at STEP[1], 结果 at STEP[2],
   hand-off at OUT. plan() gives every step enough real time to read its text (READ_CPS characters a second
   plus LEAD to take in the drawing), rounded to whole beats of the 96 BPM score. The animation plays at
   SPEED of its authored pace, then holds until the reader is done. */
const BEAT = 0.625;
const READ_CPS = 6, LEAD = 1.25, SPEED = 0.6;
const STEP = [0.625, 2.5, 4.375], OUT = 6.0, END = 6.25, HANDOFF = 0.4;
const readLoad = html => { const s = html.replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/g, ' '); return (s.match(/[㐀-鿿]/g) || []).length + (s.match(/[A-Za-z0-9][\w.+%\/−-]*/g) || []).length; };
const beats = (sec, min) => Math.max(min, Math.ceil(sec / BEAT - 1e-6)) * BEAT;
function plan(c) {
  const r = [3 * BEAT,
    beats(LEAD + readLoad(c.steps[0]) / READ_CPS, 8),
    beats(LEAD + readLoad(c.steps[1]) / READ_CPS, 10),
    beats(LEAD + 1.0 + readLoad(c.metrics.flat().join(' ')) / READ_CPS, 9)];
  const segs = [[0, STEP[0], r[0]], [STEP[0], STEP[1], r[1]], [STEP[1], STEP[2], r[2]], [STEP[2], OUT, r[3] - HANDOFF]];
  const map = [[0, 0]]; let x = 0;
  segs.forEach(([a0, a1, R]) => { const act = Math.min(R, (a1 - a0) / SPEED); if (act < R - 1e-6) map.push([x + act, a0 + (a1 - a0) * .97]); x += R; map.push([x, a1]); });
  x += HANDOFF; map.push([x, END]);
  return { map, dur: x, steps: [r[0], r[0] + r[1], r[0] + r[1] + r[2]] };
}
function warp(x, map) {
  for (let i = 1; i < map.length; i++) if (x <= map[i][0]) return lerp(map[i - 1][1], map[i][1], (x - map[i - 1][0]) / (map[i][0] - map[i - 1][0]));
  return map[map.length - 1][1] + (x - map[map.length - 1][0]);
}
const PLAN = {}, T = { intro: [0, 12 * BEAT] };
{ let cur = T.intro[1]; KEYS.forEach(k => { PLAN[k] = plan(COPY[k]); T[k] = [cur, cur + PLAN[k].dur]; cur = T[k][1]; }); T.outro = [cur, cur + 8 * BEAT]; }

function LeftCol(parent, c) {
  const root = $('div', 'layer', parent);

  const sub = $('div', 'sub abs', root, c.sub); at(sub, 120, 326);
  const wrap = $('div', 'steps', root);
  const tops = [0, 150, 300];
  const rail = $('div', 'rail', wrap); st(rail, { height: tops[2] + 'px' });
  const railFill = $('div', 'rail', wrap); st(railFill, { background: 'var(--accent)', height: '0px' });
  const labels = [['背景', 'BACKGROUND'], ['解法', 'SOLUTION'], ['结果', 'RESULT']];
  const steps = labels.map(([zh, en], i) => {
    const s = $('div', 'step', wrap); st(s, { top: tops[i] + 'px' });
    const lab = $('div', 'lab', s, `${zh}<i>${en}</i>`);
    const body = i < 2 ? $('div', 'txt', s, c.steps[i])
      : $('div', 'metrics', s, c.metrics.map(m => `<div class="metric"><div class="v">${m[0]}</div><div class="l">${m[1]}</div></div>`).join(''));
    const dot = $('div', 'dot', wrap); st(dot, { top: tops[i] + 6 + 'px' });
    return { s, lab, body, dot, parts: i < 2 ? [body] : [...body.children] };
  });
  return {
    render(u) {
      const out = oC(P(u, OUT, OUT + .25));
      st(root, { opacity: 1 - out, transform: `translateY(${-out * 16}px)` });
      rise(kick, u, 0, .45, 10);
      const tp = oQ(P(u, .05, .65)); st(title, { transform: `translateY(${(1 - tp) * 105}%)` });
      rise(sub, u, .2, .5, 10);
      steps.forEach((s, i) => {
        const t0 = STEP[i];
        rise(s.lab, u, t0, .45, 10);
        s.parts.forEach((m, k) => rise(m, u, t0 + .1 + k * .14, .55, 12));
        // once the next step arrives, earlier ones recede but stay readable
        const next = i < 2 ? P(u, STEP[i + 1], STEP[i + 1] + .4) : 0;
        st(s.s, { filter: `opacity(${1 - .45 * next})` });
        const on = P(u, t0, t0 + .3);
        st(s.dot, { background: on > 0 ? `rgba(194,65,12,${on})` : 'var(--page)', borderColor: on > 0 ? 'var(--accent)' : 'var(--faint)', opacity: P(u, .45, .7) });
      });
      st(rail, { opacity: P(u, .45, .7) });
      const fill = u < STEP[1] ? 0 : u < STEP[2] ? 150 * oQ(P(u, STEP[1], STEP[1] + .5)) : 150 + 150 * oQ(P(u, STEP[2], STEP[2] + .5));
      st(railFill, { height: fill + 'px', opacity: P(u, .45, .7) });
    },
  };
}

    { label: '执行中途主动介入', delta: '10/16', a: 10, b: 5, max: 16, at: '10/16', bt: '5/16' },

function renderFrame(t) {
  t = clamp(t, 0, DUR - 1e-6);
  st(panelBg, { opacity: P(t, T.p1[0] - .3, T.p1[0] + .3) * (1 - P(t, T.outro[0] - .3, T.outro[0] + .2)), transform: `translateY(${(1 - oQ(P(t, T.p1[0] - .3, T.p1[0] + .3))) * 20}px)` });
  INTRO.render(t); P1.render(t); P2.render(t); P3.render(t); P4.render(t); P5.render(t); P6.render(t); OUTRO.render(t);
  HUD.render(t);
}

async function boot() {
  await document.fonts.ready;
  await Promise.all(['Syne', 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC Fallback'].flatMap(f => [400, 500, 700].map(w => document.fonts.load(`${w} 40px "${f}"`, '屈非塬设计热皮肤Aa'))));
  P4.layout(); P5.layout(); OUTRO.layout();
  window.renderFrame = renderFrame;
  // the score (soundtrack.py) reads these cues so its chimes and ticks land on the same beats
  window.SHOWREEL = { duration: DUR, fps: FPS, beat: BEAT, intro: T.intro, outro: T.outro,
    chapters: KEYS.map(k => ({ id: k, start: T[k][0], end: T[k][1], steps: PLAN[k].steps.map(s => T[k][0] + s) })) };
  const q = new URLSearchParams(location.search);
  if (q.has('play')) {
    document.body.classList.add('preview');
    const start = performance.now();
    const loop = () => { renderFrame(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); };
    loop();
  } else renderFrame(parseFloat(q.get('t') || '0'));
  window.__ready = true;
}
boot();
</script>
