<style>

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --main: #8fa8f3; --ok: #5cc795; --ok-bg: #16301f; --bad: #f08a74; --bad-bg: #3a1e18; --meh: #e2b259; --meh-bg: #33280f; color-scheme: dark } }
:root[data-theme="dark"] {

.tree .lab { fill: var(--ink); font-size: 12px; font-weight: 600 }
.tree g[data-to] { cursor: pointer }
.tree g[data-to]:hover circle { stroke-width: 3 }

/* the rail: every row has a 56px gutter carrying the mainline */
.rail { display: grid }
.row { display: grid; grid-template-columns: 56px minmax(0, 1fr); position: relative; scroll-margin-top: 16px }
.row::before { content: ""; position: absolute; left: 27px; top: 0; bottom: 0; width: 2px; background: var(--main) }
.row:first-child::before { top: 28px } .row:last-child::before { bottom: auto; height: 28px }
.node { grid-column: 1; justify-self: center; margin-top: 20px; width: 16px; height: 16px; border-radius: 50%; background: var(--main); box-shadow: 0 0 0 4px var(--bg); position: relative; z-index: 1 }
.body { grid-column: 2; padding-bottom: 28px; min-width: 0 }
.row.branch .body { padding-left: 56px; position: relative }
.row.branch .body::before { content: ""; position: absolute; left: -29px; top: 0; width: 56px; height: 28px; border-left: 2px dashed var(--bad); border-bottom: 2px dashed var(--bad); border-bottom-left-radius: 14px }
.row.branch.meh .body::before { border-color: var(--meh) }
.row.branch .bnode { position: absolute; left: 26px; top: 20px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--bad); background: var(--surface) }
.row.branch.meh .bnode { border-color: var(--meh) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); overflow: hidden }
@media (max-width: 820px) { .card { grid-template-columns: minmax(0, 1fr) } }
.row.branch .card { border-style: dashed }
.info { padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.vh { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline }
.vh .no { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.vh h2 { font-size: 17px; font-weight: 650 }
.tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap }
.pill { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap }
.p-ok { background: var(--ok-bg); color: var(--ok) } .p-bad { background: var(--bad-bg); color: var(--bad) } .p-meh { background: var(--meh-bg); color: var(--meh) }
.info p { margin: 0; font-size: 13.5px }
.why { font-size: 13px; padding: 8px 10px; border-radius: 6px; background: var(--bad-bg); color: var(--ink) }
.row.meh .why { background: var(--meh-bg) }
.why b { font-weight: 600 }
.facts { font-size: 12.5px; color: var(--muted) }
.who { font-size: 12px; color: var(--muted) }
.view { border-left: 1px solid var(--line); background: #ffffff; position: relative; min-width: 0 }

.vp { height: 420px; overflow: auto }
.vp.open { height: auto }
.shot { position: relative }
.shot img { display: block; width: 100%; height: auto; max-width: 100% }
.mark { position: absolute; border: 2px dashed var(--main); border-radius: 6px; pointer-events: none }

.toggle { position: absolute; right: 10px; bottom: 10px; font: inherit; font-size: 12px; border: 1px solid #d5d9de; background: #ffffff; color: #1d2024; border-radius: 6px; padding: 3px 10px; cursor: pointer; box-shadow: 0 1px 4px rgba(0, 0, 0, .08) }
.toggle:focus-visible { outline: 2px solid var(--main); outline-offset: 2px }
</style>

  V.filter((v) => v.branch).forEach((v) => {
    const i = main.findIndex((m) => m.id === v.branch), bx = X(i) + (X(i + 1) - X(i)) * 0.55, col = v.result === "失败" ? "var(--bad)" : "var(--meh)"
    s += `<path d="M${X(i)} ${y} C ${X(i) + 20} ${y}, ${bx - 24} ${y - 52}, ${bx} ${y - 52}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="4 3"/><g data-to="${v.id}"><circle cx="${bx}" cy="${y - 52}" r="7" fill="var(--surface)" stroke="${col}" stroke-width="2"/><text class="lab" x="${bx}" y="${y - 66}" text-anchor="middle">${v.id}</text><text x="${bx}" y="${y - 30}" text-anchor="middle">${v.result}</text></g>`
  })
  document.getElementById("tree").innerHTML = s + "</svg>"
  document.querySelectorAll("#tree [data-to]").forEach((g) => g.addEventListener("click", () => document.getElementById(g.dataset.to).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" })))
}

document.getElementById("rail").innerHTML = V.map(row).join("")
tree()
// Each viewport opens on the part of the page this version changed.
document.querySelectorAll(".vp").forEach((vp) => {
  const img = vp.querySelector("img"), b = BOXES[vp.dataset.img], s = b && b.sections[vp.dataset.focus]
  const go = () => { if (s) vp.scrollTop = Math.max(0, (s.y / b.height) * img.clientHeight - 48) }
  go()
  img.addEventListener("load", go)
  vp.nextElementSibling.addEventListener("click", (e) => {
    const open = vp.classList.toggle("open")
    e.currentTarget.textContent = open ? "收起" : "看整页"
    if (!open) go()
  })
})
</script>
