<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>屈非塬 · Showreel</title>
<!--
  30-second showreel. Everything is drawn here (no screenshots) and driven by window.renderFrame(t),
  so render.mjs can step it frame by frame. Open with ?play for a realtime preview, ?t=12 to freeze.
  Four projects, each told as 背景 → 解法 → 结果; every fact comes from the site (index / toa / narrasteer / resume).
-->
<style>
  @font-face { font-family: 'Syne'; font-weight: 700; src: url('fonts/syne-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('fonts/jetbrains-mono-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'PingFang SC'; font-weight: 400; src: url('../public/fonts/PingFangSC-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'PingFang SC'; font-weight: 500; src: url('../public/fonts/PingFangSC-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'PingFang SC'; font-weight: 700; src: url('../public/fonts/PingFangSC-Bold.woff2') format('woff2'); }

  /* the site's light theme (src/styles/home.css [data-theme="light"]) */
  :root {
    --page: #ffffff; --panel: #f5f6f8; --card: #ffffff;
    --ink: #171b26; --dim: #666d7e; --dimmer: #8a92a6; --faint: #c3c8d3;
    --line: rgba(23,27,38,0.12); --line2: rgba(23,27,38,0.22);
    --accent: #c2410c; --accent-soft: rgba(194,65,12,0.10); --accent-mid: rgba(194,65,12,0.45);
    --sans: 'PingFang SC', sans-serif;
    --mono: 'JetBrains Mono', 'PingFang SC', monospace;
    --display: 'Syne', 'PingFang SC', sans-serif;
  }
  html, body { margin: 0; background: #e9ebef; }
  body.preview { display: grid; place-items: center; min-height: 100vh; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--page); color: var(--ink);
           font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .abs { position: absolute; }
  .nowrap { white-space: nowrap; }
  svg.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

  .mono { font-family: var(--mono); }
  .kick { font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; color: var(--dim); white-space: nowrap; }
  .kick b { color: var(--accent); font-weight: 500; margin-right: 14px; }
  .title { font-family: var(--sans); font-weight: 500; font-size: 40px; line-height: 1.25; letter-spacing: 0.01em; white-space: nowrap; }
  .title.latin { font-family: var(--display); font-weight: 700; letter-spacing: 0.01em; }
  .sub { font-size: 17px; line-height: 1.6; color: var(--dim); width: 560px; }
  .mask { overflow: hidden; padding-bottom: 0.08em; margin-bottom: -0.08em; }
  .mask > * { will-change: transform; }

  .steps { position: absolute; left: 120px; top: 440px; width: 600px; }
  .rail { position: absolute; left: 0; top: 10px; width: 1px; background: var(--line); }
  .dot { position: absolute; left: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--page); border: 1.5px solid var(--faint); box-sizing: border-box; }
  .step { position: absolute; left: 30px; width: 560px; }
  .step .lab { font-size: 15px; font-weight: 500; color: var(--ink); white-space: nowrap; }
  .step .lab i { font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; color: var(--dimmer); margin-left: 12px; }
  .step .txt { margin-top: 8px; font-size: 20px; line-height: 1.6; color: var(--ink); }
  .step .txt em { font-style: normal; color: var(--accent); }
  .metrics { display: flex; gap: 40px; margin-top: 10px; }
  .metric .v { font-family: var(--mono); font-weight: 500; font-size: 34px; letter-spacing: -0.02em; color: var(--accent); line-height: 1.1; white-space: nowrap; }
  .metric .l { font-size: 13px; color: var(--dim); margin-top: 6px; white-space: nowrap; }

  /* right-hand illustration panel */
  #panel { position: absolute; left: 780px; top: 150px; width: 1020px; height: 780px; border-radius: 20px; background: var(--panel); }
  .card { position: absolute; background: var(--card); border-radius: 10px; box-shadow: 0 1px 0 rgba(23,27,38,0.04), 0 10px 30px rgba(23,27,38,0.06); box-sizing: border-box; }
  .cap { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; color: var(--dimmer); white-space: nowrap; }
  .zh13 { font-size: 13px; color: var(--dim); white-space: nowrap; }
  .tile { position: absolute; width: 58px; height: 36px; border-radius: 6px; background: var(--card); border: 1px solid var(--line2); box-sizing: border-box;
          font-family: var(--mono); font-size: 10px; color: var(--dimmer); text-align: center; line-height: 34px; }
  .chipx { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--panel); color: var(--dim); margin-right: 6px; white-space: nowrap; }
  .station { position: absolute; width: 150px; height: 52px; border-radius: 26px; background: var(--card); box-shadow: 0 6px 20px rgba(23,27,38,0.06);
             text-align: center; line-height: 52px; font-size: 16px; font-weight: 500; }
  .meter { display: flex; align-items: center; gap: 12px; margin: 9px 0; font-size: 13px; color: var(--ink); white-space: nowrap; }
  .meter .n { width: 86px; }
  .meter .tr { position: relative; width: 110px; height: 3px; border-radius: 2px; background: var(--line); }
  .meter .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--accent); }
  .meter .ok { color: var(--accent); font-size: 13px; }
  .wf { position: absolute; background: #eef0f3; border-radius: 3px; }
  .cvb { position: absolute; border: 1.5px dashed var(--accent); border-radius: 4px; }
  .cvt { position: absolute; font-family: var(--mono); font-size: 9px; font-weight: 700; color: #fff; background: var(--accent); padding: 0 4px; line-height: 13px; border-radius: 2px; }

  .logl { font-family: var(--mono); font-size: 13px; color: var(--dim); margin: 0 0 13px; white-space: nowrap; }
  .logl i { display: inline-block; width: 15px; height: 15px; border-radius: 50%; background: var(--panel); color: var(--dimmer); font-style: normal; font-size: 10px; line-height: 15px; text-align: center; margin-right: 10px; vertical-align: 1px; }
  .pdot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 7px; background: var(--faint); }

  .npop { position: absolute; width: 300px; background: var(--card); border-radius: 8px; padding: 12px; font-size: 13px; color: var(--ink); box-shadow: 0 14px 40px rgba(23,27,38,0.14); box-sizing: border-box; }
  .npop .cols { display: flex; gap: 8px; align-items: center; }
  .npop .col { flex: 1; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  .npop .col b { display: block; margin-bottom: 4px; font-weight: 500; font-family: var(--mono); font-size: 12px; }
  .npop .fl { color: var(--dim); font-family: var(--mono); font-size: 11px; line-height: 1.6; }
  .npop .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; font-family: var(--mono); font-size: 11px; }
  .npop .btn { padding: 3px 10px; border: 1px solid var(--line2); border-radius: 3px; color: var(--dim); }
  .npop .btn.go { background: var(--ink); color: #fff; border-color: var(--ink); }

  .tnode { position: absolute; width: 176px; padding: 8px 10px; background: var(--card); border-radius: 6px; box-shadow: 0 0 0 1px var(--line2); box-sizing: border-box;
           font-family: var(--mono); font-size: 11px; color: var(--dimmer); }
  .tnode.dash { box-shadow: none; border: 1px dashed var(--faint); background: rgba(255,255,255,0.6); }
  .tnode.focus { box-shadow: 0 0 0 1.5px var(--accent), 0 8px 24px rgba(194,65,12,0.12); }
  .tnode .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 2px 0; }
  .tnode .c { color: var(--ink); background: var(--panel); border-radius: 8px; padding: 0 6px; line-height: 16px; }
  .tnode .c.f { color: var(--accent); background: var(--accent-soft); }
  .troot { position: absolute; width: 110px; height: 34px; line-height: 34px; text-align: center; background: var(--card); border-radius: 6px; box-shadow: 0 0 0 1px var(--line2);
           font-family: var(--mono); font-size: 13px; color: var(--ink); }
  .msgq { margin: 0 0 12px auto; width: fit-content; max-width: 330px; padding: 8px 12px; background: var(--panel); border-radius: 8px; font-size: 13px; line-height: 1.45; color: var(--ink); font-family: var(--mono); }
  .msga { margin: 0 0 16px; padding: 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); font-size: 12px; color: var(--dim); line-height: 1.5; font-family: var(--mono); }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 60px; margin-top: 8px; border-bottom: 1px solid var(--line2); }
  .bars i { display: block; width: 24px; background: #d5d9e1; border-radius: 2px 2px 0 0; }
  .bars i.hi { background: var(--accent); }
  .sigp { position: absolute; width: 236px; background: var(--card); border-radius: 8px; padding: 8px; box-shadow: 0 14px 40px rgba(23,27,38,0.14); box-sizing: border-box; }
  .sig { padding: 6px 8px; margin: 3px 0; background: var(--panel); border-radius: 4px; font-size: 11px; color: var(--dim); line-height: 1.4; position: relative; font-family: var(--mono); }
  .sig b { display: block; color: var(--ink); font-weight: 500; }
  .sig .rec { position: absolute; right: 6px; bottom: 6px; background: var(--ink); color: #fff; font-size: 9px; font-weight: 700; padding: 0 6px; border-radius: 2px; }

  .cmp { position: absolute; width: 400px; padding: 26px 28px; }
  .cmp .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .cmp .lg { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .cmp .lg span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 6px 0 14px; vertical-align: -1px; }
  .cmp .r { margin: 0 0 18px; }
  .cmp .rl { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink); margin-bottom: 8px; white-space: nowrap; }
  .cmp .rl b { font-family: var(--mono); font-weight: 500; color: var(--accent); font-size: 14px; }
  .cmp .bar { position: relative; height: 12px; margin: 5px 0; }
  .cmp .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
  .cmp .bar span { position: absolute; top: -2px; font-family: var(--mono); font-size: 11px; color: var(--dim); white-space: nowrap; }

  .plane { position: absolute; width: 340px; height: 214px; border-radius: 10px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 20px 40px rgba(23,27,38,0.08); transform: rotateX(58deg) rotateZ(-42deg); }
  .modl { position: absolute; width: 132px; height: 44px; border-radius: 8px; background: var(--card); box-shadow: 0 0 0 1px var(--line2); box-sizing: border-box;
          font-size: 13px; color: var(--dim); text-align: center; line-height: 44px; white-space: nowrap; }
  .stg { position: absolute; width: 120px; height: 44px; border-radius: 22px; background: var(--card); box-shadow: 0 6px 18px rgba(23,27,38,0.06); text-align: center; line-height: 44px; font-size: 16px; font-weight: 500; }

  .toc { position: absolute; left: 1000px; top: 380px; width: 800px; }
  .toc .h { margin-bottom: 18px; }
  .toc .rw { display: flex; align-items: baseline; gap: 22px; padding: 18px 0; border-top: 1px solid var(--line); white-space: nowrap; }
  .toc .rw:last-child { border-bottom: 1px solid var(--line); }
  .toc .i { font-family: var(--mono); font-size: 13px; color: var(--accent); width: 24px; }
  .toc .n { font-size: 20px; font-weight: 500; width: 300px; }
  .toc .d { font-size: 15px; color: var(--dim); flex: 1; }
  .toc .y { font-family: var(--mono); font-size: 13px; color: var(--dimmer); }

  #hud .seg { position: absolute; top: 1004px; height: 20px; }
  #hud .seg .l { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--dimmer); white-space: nowrap; }
  #hud .seg .t { position: absolute; left: 0; right: 0; top: 22px; height: 2px; background: var(--line); }
  #hud .seg .f { position: absolute; left: 0; top: 22px; height: 2px; background: var(--accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="panel"></div>
  <div id="world" class="layer"></div>
  <div id="hud" class="layer"></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#171b26" stroke-width="1.6"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#c2410c" stroke-width="1.6"/></marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eef0f3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#c3c8d3" stroke-width="2"/></pattern>
  </defs>
</svg>

<script>
/* ============================================================ utilities */
const W = 1920, H = 1080, FPS = 60;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const oQ = x => 1 - Math.pow(1 - x, 4);
const oC = x => 1 - Math.pow(1 - x, 3);
const ioC = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const oB = (x, s = 1.2) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6d2b79f5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || document.body).appendChild(e); return e; };
const NS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const st = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const at = (e, x, y) => st(e, { left: x + 'px', top: y + 'px' });
const vis = (e, on) => { e.style.visibility = on ? 'visible' : 'hidden'; };
/* soft entrance: fade + small rise; returns progress */
const rise = (e, t, t0, d = .5, dy = 14) => { const p = oQ(P(t, t0, t0 + d)); st(e, { opacity: p, transform: `translateY(${(1 - p) * dy}px)` }); return p; };
/* line draw-on */
const draw = (el, p) => { const L = el.getTotalLength(); st(el, { strokeDasharray: `${L} ${L}`, strokeDashoffset: L * (1 - p) }); };

/* ============================================================ timeline
   96 BPM → one beat = 0.625 s. Each project gets 10 beats (6.25 s):
   header on beat 0, 背景 on beat 1, 解法 on beat 4, 结果 on beat 7. */
const BEAT = 0.625;
const T = { intro: [0, 2.5], p1: [2.5, 8.75], p2: [8.75, 15.0], p3: [15.0, 21.25], p4: [21.25, 27.5], outro: [27.5, 30.0] };
const STEP = [BEAT, 4 * BEAT, 7 * BEAT];   // local start of 背景 / 解法 / 结果
const OUT = 6.0;                            // local start of the hand-off to the next project
const DUR = 30.0;

const world = document.getElementById('world');
const panelBg = document.getElementById('panel');

/* ============================================================ left column: header + 背景 / 解法 / 结果 */
function LeftCol(parent, c) {
  const root = $('div', 'layer', parent);
  const kick = $('div', 'kick abs', root, `<b>${c.idx}</b>${c.kicker}`); at(kick, 120, 236);
  const tm = $('div', 'mask abs', root); at(tm, 120, 264);
  const title = $('div', 'title' + (c.latin ? ' latin' : ''), tm, c.title);
  const sub = $('div', 'sub abs', root, c.sub); at(sub, 120, 326);
  const wrap = $('div', 'steps', root);
  const tops = [0, 150, 300];
  const rail = $('div', 'rail', wrap); st(rail, { height: tops[2] + 'px' });
  const railFill = $('div', 'rail', wrap); st(railFill, { background: 'var(--accent)', height: '0px' });
  const labels = [['背景', 'BACKGROUND'], ['解法', 'SOLUTION'], ['结果', 'RESULT']];
  const steps = labels.map(([zh, en], i) => {
    const s = $('div', 'step', wrap); st(s, { top: tops[i] + 'px' });
    const lab = $('div', 'lab', s, `${zh}<i>${en}</i>`);
    const body = i < 2 ? $('div', 'txt', s, c.steps[i])
      : $('div', 'metrics', s, c.metrics.map(m => `<div class="metric"><div class="v">${m[0]}</div><div class="l">${m[1]}</div></div>`).join(''));
    const dot = $('div', 'dot', wrap); st(dot, { top: tops[i] + 6 + 'px' });
    return { s, lab, body, dot, parts: i < 2 ? [body] : [...body.children] };
  });
  return {
    render(u) {
      const out = oC(P(u, OUT, OUT + .25));
      st(root, { opacity: 1 - out, transform: `translateY(${-out * 16}px)` });
      rise(kick, u, 0, .45, 10);
      const tp = oQ(P(u, .05, .65)); st(title, { transform: `translateY(${(1 - tp) * 105}%)` });
      rise(sub, u, .2, .5, 10);
      steps.forEach((s, i) => {
        const t0 = STEP[i];
        rise(s.lab, u, t0, .45, 10);
        s.parts.forEach((m, k) => rise(m, u, t0 + .1 + k * .14, .55, 12));
        // once the next step arrives, earlier ones recede but stay readable
        const next = i < 2 ? P(u, STEP[i + 1], STEP[i + 1] + .4) : 0;
        st(s.s, { filter: `opacity(${1 - .45 * next})` });
        const on = P(u, t0, t0 + .3);
        st(s.dot, { background: on > 0 ? `rgba(194,65,12,${on})` : 'var(--page)', borderColor: on > 0 ? 'var(--accent)' : 'var(--faint)', opacity: P(u, .45, .7) });
      });
      st(rail, { opacity: P(u, .45, .7) });
      const fill = u < STEP[1] ? 0 : u < STEP[2] ? 150 * oQ(P(u, STEP[1], STEP[1] + .5)) : 150 + 150 * oQ(P(u, STEP[2], STEP[2] + .5));
      st(railFill, { height: fill + 'px', opacity: P(u, .45, .7) });
    },
  };
}

/* comparison card: accent = our system, grey = baseline (real study numbers) */
function Compare(parent, x, y, sys, rows) {
  const c = $('div', 'card cmp', parent); at(c, x, y);
  $('div', 'hd', c, `<div class="cap">对照实验</div><div class="lg"><span style="background:var(--accent)"></span>${sys}<span style="background:#d5d9e1"></span>基线</div>`);
  const W0 = 250;
  const rs = rows.map(r => {
    const e = $('div', 'r', c);
    $('div', 'rl', e, `<span>${r.label}</span><b>${r.delta}</b>`);
    const mk = (v, col, txt) => { const b = $('div', 'bar', e); const i = $('i', '', b); st(i, { background: col }); const s = $('span', '', b, txt); return { i, s, w: v / r.max * W0 }; };
    return { a: mk(r.a, 'var(--accent)', r.at), b: mk(r.b, '#d5d9e1', r.bt) };
  });
  return {
    render(u, t0) {
      rise(c, u, t0, .5, 16);
      rs.forEach((r, k) => [r.a, r.b].forEach((b, j) => {
        const p = oQ(P(u, t0 + .15 + k * .12 + j * .05, t0 + .75 + k * .12 + j * .05));
        st(b.i, { width: b.w * p + 'px' }); st(b.s, { left: b.w * p + 10 + 'px', opacity: P(u, t0 + .45 + k * .12, t0 + .7 + k * .12) });
      }));
    },
  };
}

function Scene(range) {
  const root = $('div', 'layer', world);
  return { root, on(t) { const on = t >= range[0] - .01 && t < range[1] + .01; vis(root, on); return on; } };
}

/* ============================================================ INTRO */
const INTRO = (() => {
  const sc = Scene(T.intro);
  const r = sc.root;
  const nm = $('div', 'mask abs', r); at(nm, 120, 372);
  const name = $('div', '', nm, '屈非塬'); st(name, { fontSize: '56px', fontWeight: 500, letterSpacing: '0.12em', whiteSpace: 'nowrap' });
  const en = $('div', 'abs nowrap', r, 'QU FEIYUAN'); at(en, 122, 456); st(en, { fontFamily: 'var(--display)', fontWeight: 700, fontSize: '15px', letterSpacing: '0.34em', color: 'var(--dim)' });

/* ============================================================ HUD: name, chapter index, progress */
const HUD = (() => {
  const h = document.getElementById('hud');
  const tl = $('div', 'abs kick', h, '屈非塬 &nbsp;·&nbsp; QU FEIYUAN'); at(tl, 120, 70);
  const tr = $('div', 'abs kick', h); st(tr, { right: '120px', top: '70px' });
  const chaps = [['01', '阿里巴巴淘天', T.p1], ['02', 'NARRASTEER', T.p2], ['03', 'TOA', T.p3], ['04', '舆情分析与治理平台', T.p4]];
  const span = 1680, gap = 24, w = (span - gap * 3) / 4;
  const segs = chaps.map(([i, n, r], k) => { const s = $('div', 'seg', h); st(s, { left: 120 + k * (w + gap) + 'px', width: w + 'px' }); const l = $('div', 'l', s, `${i}&nbsp;&nbsp;${n}`); $('div', 't', s); const f = $('div', 'f', s); return { l, f, r }; });
  return {
    render(t) {
      h.style.opacity = P(t, 2.3, 2.7) * (1 - P(t, 27.3, 27.7));
      const cur = chaps.findIndex(c => t >= c[2][0] && t < c[2][1]);
      tr.innerHTML = cur >= 0 ? `<b style="color:var(--accent);font-weight:500">0${cur + 1}</b> &nbsp;/&nbsp; 04` : '';
      segs.forEach(s => {
        s.f.style.width = P(t, s.r[0], s.r[1]) * 100 + '%';
        s.f.style.background = t >= s.r[1] ? 'var(--faint)' : 'var(--accent)';
        s.l.style.color = t >= s.r[0] && t < s.r[1] ? 'var(--ink)' : 'var(--dimmer)';
      });
    },
  };
})();

/* ============================================================ frame */
function renderFrame(t) {
  t = clamp(t, 0, DUR - 1e-6);
  st(panelBg, { opacity: P(t, 2.25, 2.75) * (1 - P(t, 27.25, 27.75)), transform: `translateY(${(1 - oQ(P(t, 2.25, 2.75))) * 20}px)` });
  INTRO.render(t); P1.render(t); P2.render(t); P3.render(t); P4.render(t); OUTRO.render(t);
  HUD.render(t);
}

async function boot() {
  await document.fonts.ready;
  await Promise.all(['Syne', 'JetBrains Mono', 'PingFang SC'].flatMap(f => [400, 500, 700].map(w => document.fonts.load(`${w} 40px "${f}"`, '屈非塬设计工程Aa'))));
  P2.layout(); P3.layout(); OUTRO.layout();
  window.renderFrame = renderFrame;
  window.SHOWREEL = { duration: DUR, fps: FPS };
  const q = new URLSearchParams(location.search);
  if (q.has('play')) {
    document.body.classList.add('preview');
    const start = performance.now();
    const loop = () => { renderFrame(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); };
    loop();
  } else renderFrame(parseFloat(q.get('t') || '0'));
  window.__ready = true;
}
boot();
</script>
