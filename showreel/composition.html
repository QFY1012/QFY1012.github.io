<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Qu Feiyuan · Showreel</title>
<!--
  15-second showreel composition. Everything is driven by window.renderFrame(t) (t in seconds),
  so render.mjs can step it frame by frame. Open with ?play for a realtime preview, or ?t=8.5
  to freeze on a single moment. All content comes from the site (index / toa / narrasteer / resume).
-->
<style>
  @font-face { font-family: 'Syne'; font-weight: 600; src: url('fonts/syne-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Syne'; font-weight: 700; src: url('fonts/syne-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Syne'; font-weight: 800; src: url('fonts/syne-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('fonts/jetbrains-mono-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'PingFang SC'; font-weight: 400; src: url('../public/fonts/PingFangSC-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'PingFang SC'; font-weight: 500; src: url('../public/fonts/PingFangSC-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'PingFang SC'; font-weight: 700; src: url('../public/fonts/PingFangSC-Bold.woff2') format('woff2'); }

  /* site palette (src/styles/home.css, dark theme) */
  :root {
    --bg: #0a0c12; --panel: #10141d; --text: #e6eaf3; --dim: #848c9f; --dimmer: #626b82;
    --teal: #00e8c8; --teal2: #1291ab; --orange: #ff8c42;
    --line: rgba(255,255,255,0.14); --line2: rgba(255,255,255,0.28);
    --mono: 'JetBrains Mono', 'PingFang SC', monospace;
    --display: 'Syne', 'PingFang SC', sans-serif;
    --zh: 'PingFang SC', sans-serif;
  }
  html, body { margin: 0; background: #000; }
  body.preview { display: grid; place-items: center; min-height: 100vh; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
           color: var(--text); font-family: var(--mono); -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .abs { position: absolute; }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; visibility: hidden; }
  svg.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

  /* letter masks for kinetic type */
  .lm { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.08em 0 0.04em; margin: -0.08em 0 -0.04em; }
  .lc { display: inline-block; will-change: transform; }
  .display { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 0.92; white-space: nowrap; }
  .kicker { font-family: var(--mono); font-weight: 500; font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--teal); white-space: nowrap; }
  .meta { font-family: var(--mono); font-size: 16px; letter-spacing: 0.08em; color: var(--dim); white-space: nowrap; }
  .chip { position: absolute; font-family: var(--mono); font-size: 17px; font-weight: 500; letter-spacing: 0.12em; color: var(--text);
          padding: 7px 14px; background: rgba(255,255,255,0.06); white-space: nowrap; }
  .chip b { color: var(--teal); font-weight: 500; margin-right: 10px; }
  .badge { display: inline-block; font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: 0.12em; padding: 6px 12px;
           margin-right: 10px; background: rgba(0,232,200,0.12); color: var(--teal); white-space: nowrap; }
  .badge.ghost { background: rgba(255,255,255,0.06); color: var(--text); }
  .metric { font-family: var(--mono); font-weight: 700; color: var(--teal); letter-spacing: -0.04em; line-height: 0.9; white-space: nowrap; }

  /* HUD */
  #hud .tl { left: 56px; top: 44px; }
  #hud .tr { right: 56px; top: 36px; text-align: right; }
  .roller { display: inline-flex; font-family: var(--mono); font-weight: 500; font-size: 30px; letter-spacing: 0.04em; color: var(--text); height: 36px; overflow: hidden; }
  .roller .col { display: flex; flex-direction: column; }
  .roller .col span { height: 36px; line-height: 36px; }
  .chapters { position: absolute; left: 96px; right: 96px; bottom: 44px; height: 30px; }
  .chap { position: absolute; bottom: 0; height: 30px; }
  .chap .lab { position: absolute; left: 0; bottom: 10px; font-size: 12px; letter-spacing: 0.16em; color: var(--dimmer); white-space: nowrap; }
  .chap .trk { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,0.12); }
  .chap .fil { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--teal); width: 0; }

  /* ToA vector recreation */
  .tnode { position: absolute; width: 214px; padding: 10px 12px; background: #121722; border: 1.5px solid rgba(255,255,255,0.26); border-radius: 6px;
           font-family: var(--mono); font-size: 13px; color: var(--dim); box-sizing: border-box; transform-origin: 50% 50%; }
  .tnode.dash { border-style: dashed; background: rgba(18,23,34,0.6); }
  .tnode.focus { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal), 0 0 28px rgba(0,232,200,0.25); }
  .tnode .row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 2px 0; }
  .tnode .k { color: var(--dimmer); margin-right: 2px; }
  .tnode .c { color: var(--text); border: 1px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 0 7px; font-size: 12px; line-height: 18px; }
  .tnode .c.f { border-color: rgba(0,232,200,0.6); color: var(--teal); }
  .troot { position: absolute; width: 150px; height: 44px; line-height: 44px; text-align: center; background: #121722; border: 1.5px solid rgba(255,255,255,0.4);
           border-radius: 6px; font-family: var(--mono); font-size: 16px; color: var(--text); letter-spacing: 0.1em; }
  .elabel { font-family: var(--mono); font-style: italic; font-size: 14px; fill: var(--dim); }
  .chat { position: absolute; left: 1150px; top: 0; width: 640px; }
  .msg-q { margin: 0 0 16px auto; width: fit-content; max-width: 460px; padding: 10px 16px; background: rgba(255,255,255,0.07); border-radius: 8px; font-size: 15px; color: var(--text); }
  .msg-a { margin: 0 0 22px; padding: 16px; background: #121722; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; font-size: 13px; color: var(--dim); line-height: 1.5; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 90px; margin-top: 10px; padding-left: 6px; border-left: 1px solid rgba(255,255,255,0.2); border-bottom: 1px solid rgba(255,255,255,0.2); }
  .bars i { display: block; width: 34px; }
  .popover { position: absolute; width: 270px; background: #151b27; border: 1px solid rgba(255,255,255,0.22); border-radius: 6px; padding: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  .sig { padding: 8px 10px; margin: 4px 0; background: rgba(255,255,255,0.04); border-radius: 4px; font-size: 13px; color: var(--dim); line-height: 1.4; position: relative; }
  .sig b { display: block; color: var(--text); font-family: var(--mono); font-size: 13px; }
  .sig .rec { position: absolute; right: 8px; bottom: 8px; background: var(--text); color: #0a0c12; font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 2px; }

  /* NarraSteer */
  .pill { font-family: var(--mono); font-size: 14px; }
  .nlabel { font-family: var(--mono); font-size: 11px; fill: var(--dim); }
  .tlabel { font-family: var(--mono); font-style: italic; font-size: 14px; font-weight: 500; }
  .log { font-family: var(--mono); font-size: 17px; color: var(--dim); white-space: nowrap; margin: 0 0 14px; }
  .log i { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.18); color: var(--bg); font-style: normal; font-size: 12px; line-height: 18px; text-align: center; margin-right: 12px; vertical-align: 1px; }
  .npop { position: absolute; width: 380px; background: #151b27; border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 14px; font-size: 14px; color: var(--text); box-shadow: 0 16px 50px rgba(0,0,0,0.55); }
  .npop .cols { display: flex; gap: 12px; align-items: stretch; }
  .npop .col { flex: 1; border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; padding: 8px; }
  .npop .col b { display: block; margin-bottom: 6px; font-weight: 500; }
  .npop .fl { border: 1px solid rgba(255,255,255,0.14); border-radius: 3px; padding: 3px 6px; margin: 4px 0; color: var(--dim); font-size: 12px; }
  .npop .fl em { color: var(--text); font-style: italic; font-weight: 700; }
  .npop .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
  .npop .btn { padding: 5px 14px; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px; font-size: 13px; }
  .npop .btn.go { background: var(--text); color: #0a0c12; font-weight: 700; border-color: var(--text); }

  /* Alibaba */
  .evrow { display: flex; align-items: center; gap: 16px; margin: 10px 0; font-family: var(--mono); font-size: 15px; letter-spacing: 0.12em; color: var(--text); white-space: nowrap; }
  .evrow .nm { width: 230px; }
  .evrow .tr { position: relative; width: 250px; height: 3px; background: rgba(255,255,255,0.12); }
  .evrow .tr i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--teal); }
  .evrow .ok { color: var(--teal); width: 20px; }
  .wf { position: absolute; background: rgba(255,255,255,0.08); border-radius: 3px; }
  .cvbox { position: absolute; border: 1.5px dashed var(--teal); border-radius: 3px; }
  .cvtag { position: absolute; font-family: var(--mono); font-size: 11px; font-weight: 700; color: #0a0c12; background: var(--teal); padding: 0 5px; line-height: 16px; white-space: nowrap; }

  /* Public-opinion panels */
  .panel { position: absolute; width: 920px; height: 518px; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.12);
           background-size: cover; background-position: center; backface-visibility: hidden; }

  /* Undergrad flashes */
  .flash { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; visibility: hidden; }
  .flash .img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background-size: cover; background-position: center; }
  .flash .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,12,18,0.92) 0%, rgba(10,12,18,0.35) 42%, rgba(10,12,18,0) 70%); }
  .flash .ttl { position: absolute; left: 96px; bottom: 150px; }
  .flash .ttl .display { font-size: 120px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="particles" class="layer" width="1920" height="1080"></canvas>
  <div id="world" class="layer"></div>
  <div id="hud" class="layer"></div>
  <div id="vignette" class="layer" style="background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); pointer-events:none"></div>
  <canvas id="grain" class="layer" width="960" height="540" style="opacity:0.04; mix-blend-mode:screen"></canvas>
  <div id="flashfx" class="layer" style="background:#fff; opacity:0"></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="hblur" x="-60%" y="-10%" width="220%" height="120%"><feGaussianBlur id="hblurStd" stdDeviation="0 0"/></filter>
    <marker id="arrT" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00e8c8"/></marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6eaf3"/></marker>
  </defs>
</svg>

<script>
/* ============================================================
   utilities
   ============================================================ */
const W = 1920, H = 1080, FPS = 60;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const oE = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const iE = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const ioE = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const oC = x => 1 - Math.pow(1 - x, 3);
const iC = x => x * x * x;
const ioC = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const oQ = x => 1 - Math.pow(1 - x, 4);
const oB = (x, s = 1.7) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const win = (t, a, b, fi = .12, fo = .12) => Math.min(P(t, a, a + fi), 1 - P(t, b - fo, b));
function mulberry32(a) { return () => { a |= 0; a = a + 0x6d2b79f5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || document.body).appendChild(e); return e; };
const NS = 'http://www.w3.org/2000/svg';
const S = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const st = (e, o) => { for (const k in o) e.style[k] = o[k]; };
const pos = (e, x, y) => st(e, { left: x + 'px', top: y + 'px' });
const show = (e, on) => { e.style.visibility = on ? 'visible' : 'hidden'; };
const fmt = (v, d) => v.toFixed(d);

/* kinetic letters: each glyph rides up out of its own mask */
function Letters(parent, text, cls, style) {
  const root = $('div', cls, parent);
  if (style) st(root, style);
  const spans = [...text].map(ch => { const m = $('span', 'lm', root); return $('span', 'lc', m, ch === ' ' ? '&nbsp;' : ch); });
  return { root, spans };
}
function reveal(L, t, t0, o = {}) {
  const { stagger = .028, dur = .42, ease = oE, out = null, outStagger = .012, outDur = .16, from = 1.1 } = o;
  const n = L.spans.length;
  L.spans.forEach((s, i) => {
    const p = ease(P(t, t0 + i * stagger, t0 + i * stagger + dur));
    let y = (1 - p) * from * 100;
    if (out != null) { const q = P(t, out + i * outStagger, out + i * outStagger + outDur); y -= q * q * 115; }
    s.style.transform = `translate3d(0,${y}%,0)`;
  });
}
/* typewriter */
function typed(text, t, t0, cps) { const n = Math.floor(clamp((t - t0) * cps, 0, text.length)); return text.slice(0, n); }

/* horizontal motion blur (whip pans) */
const hblurStd = document.getElementById('hblurStd');

/* ============================================================
   timeline — beats at 120 BPM (0.5 s); chapters get the screen time
   ============================================================ */
const T = { intro: [0, 1.5], ali: [1.5, 4.0], ns: [4.0, 6.5], toa: [6.5, 9.5], po: [9.5, 11.75], ug: [11.75, 12.5], end: [12.5, 15.0] };
const DUR = 15.0;
const HITS = [0.5, 1.0, 3.0, 6.0, 8.5, 11.0, 12.5];   // slams that kick the camera

const stage = document.getElementById('stage');
const world = document.getElementById('world');
const hud = document.getElementById('hud');
const flashfx = document.getElementById('flashfx');

/* ============================================================
   PARTICLES — the site's hero: a depth-of-field Möbius band
   (src/scripts/hero-particles.ts). Bookends the reel: a haze at
   the open, then pulled into focus behind the name.
   ============================================================ */
const PT = (() => {
  const cv = document.getElementById('particles');
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(W, H);
  const A = new Float32Array(W * H), B = new Float32Array(W * H);
  const N = 200000;
  const rnd = mulberry32(1012);
  const bx = new Float32Array(N), by = new Float32Array(N), bz = new Float32Array(N);
  const dx = new Float32Array(N), dy = new Float32Array(N);
  const sx = new Float32Array(N), sy = new Float32Array(N), sz = new Float32Array(N);
  const key = new Float32Array(N);
  const R = 720, WID = 0.24;
  for (let i = 0; i < N; i++) {
    const u = rnd() * Math.PI * 2, v = (rnd() * 2 - 1) * WID, th = (rnd() - .5) * 0.02;
    const c = Math.cos(u / 2), s = Math.sin(u / 2);
    bx[i] = (1 + v * c) * Math.cos(u) * R; by[i] = (1 + v * c) * Math.sin(u) * R; bz[i] = (v * s + th) * R;
    const a = rnd() * Math.PI * 2, m = Math.sqrt(rnd());
    dx[i] = Math.cos(a) * m; dy[i] = Math.sin(a) * m;
    const sc = 1.15 + rnd() * 0.7; sx[i] = bx[i] * sc + (rnd() - .5) * 300; sy[i] = by[i] * sc + (rnd() - .5) * 300; sz[i] = bz[i] * sc + (rnd() - .5) * 600;
    key[i] = (u / (Math.PI * 2) + rnd() * 0.35) / 1.35;
  }
  const teal = [0, 232, 200], far = [18, 145, 171], bg = [10, 12, 18];
  let wasClear = false;
  function clear() { if (!wasClear) { ctx.clearRect(0, 0, W, H); wasClear = true; } }
  function splat(buf, x, y, w) {
    const x0 = x | 0, y0 = y | 0; if (x0 < 0 || y0 < 0 || x0 >= W - 1 || y0 >= H - 1) return;
    const fx = x - x0, fy = y - y0, i = y0 * W + x0;
    buf[i] += w * (1 - fx) * (1 - fy); buf[i + 1] += w * fx * (1 - fy); buf[i + W] += w * (1 - fx) * fy; buf[i + W + 1] += w * fx * fy;
  }
  /* o: { spin, tilt, roll, cx, cy, coc, alpha, gather (0..1 scattered→band), fade } */
  function draw(o) {
    wasClear = false;
    A.fill(0); B.fill(0);
    const D = 2200, F = 1850;
    const cs = Math.cos(o.spin), sn = Math.sin(o.spin), ct = Math.cos(o.tilt), stl = Math.sin(o.tilt), cr = Math.cos(o.roll), sr = Math.sin(o.roll);
    const g = o.gather, coc = o.coc, al = o.alpha;
    for (let i = 0; i < N; i++) {
      let lx = bx[i], ly = by[i], lz = bz[i], c0 = cs, s0 = sn;
      if (g < 1) { // spiral in: contract toward the band while swirling about its axis
        const p = ioC(clamp((g - key[i] * 0.45) / 0.55)), q = 1 - p;
        lx = lerp(sx[i], lx, p); ly = lerp(sy[i], ly, p); lz = lerp(sz[i], lz, p);
        const a = o.spin - 2.2 * q * q; c0 = Math.cos(a); s0 = Math.sin(a);
      }
      let x = lx * c0 - ly * s0, y = lx * s0 + ly * c0, z = lz;
      const y2 = y * ct - z * stl, z2 = y * stl + z * ct; y = y2; z = z2;
      const x3 = x * cr - y * sr, y3 = x * sr + y * cr; x = x3; y = y3;
      const d = D + z; if (d < 200) continue;
      const k = F / d;
      const r = coc * Math.abs(d - D) + o.blurAll;
      const X = o.cx + x * k + dx[i] * r, Y = o.cy + y * k + dy[i] * r;
      const m = clamp(r / 26);
      const w = al * k * k / (1 + r * 0.05);
      splat(A, X, Y, w * (1 - m)); splat(B, X, Y, w * m);
    }
    const px = img.data, fd = o.fade;
    for (let i = 0, j = 0; i < W * H; i++, j += 4) {
      const a = (1 - Math.exp(-A[i])) * fd, b = (1 - Math.exp(-B[i])) * fd;
      px[j] = bg[0] + teal[0] * a + far[0] * b; px[j + 1] = bg[1] + teal[1] * a + far[1] * b; px[j + 2] = bg[2] + teal[2] * a + far[2] * b; px[j + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  return { draw, clear };
})();

/* grain — a few deterministic noise tiles, cycled per frame */
const GR = (() => {
  const cv = document.getElementById('grain'), ctx = cv.getContext('2d'); const tiles = []; const r = mulberry32(7);
  for (let k = 0; k < 6; k++) { const id = ctx.createImageData(960, 540); for (let j = 0; j < id.data.length; j += 4) { const v = r() * 255; id.data[j] = id.data[j + 1] = id.data[j + 2] = v; id.data[j + 3] = 255; } tiles.push(id); }
  return { draw(f) { ctx.putImageData(tiles[f % tiles.length], 0, 0); } };
})();

/* ============================================================
   HUD — chapter bar (screen time per chapter) + rolling year
   ============================================================ */
const CHAPTERS = [
  { id: 'ali', label: '01  ALIBABA', range: T.ali, year: '2026', dates: '2026.06 — NOW' },
  { id: 'ns',  label: '02  NARRASTEER', range: T.ns, year: '2026', dates: '2026.01 — 2026.04' },
  { id: 'toa', label: '03  TOA', range: T.toa, year: '2025', dates: '2025.07 — 2025.11' },
  { id: 'po',  label: '04  PUBLIC OPINION', range: T.po, year: '2024', dates: '2024.09 — 2025.04' },
  { id: 'ug',  label: 'UNDERGRAD', range: T.ug, year: '2020', dates: '2020 — 2024' },
];

      msgs.forEach((m, i) => { const f = ioC(P(u, .5 + i * .012, .7 + i * .012)); st(m, { transform: `translateX(${-f * 160}px) scale(${1 - f * .5})`, opacity: 1 - f }); });
      // camera: pull back (arrival) → push into the focus node → hand off to the real UI
      const push = ioC(P(u, 1.0, 1.4));
      const s = lerp(1.14 - .14 * arrive, 1.08, push) + push * (u - 1.0) * .03;
      const fx = 1440, fy = lerp(480, 440, push);
      st(cam, { transform: `translate(${1440 - fx * s}px, ${540 - fy * s + (1 - arrive) * 30}px) scale(${s})`, transformOrigin: '0 0', opacity: 1 - P(u, 1.5, 1.66) });
      // tree build
      const rp = oB(P(u, .45, .65)); st(root, { transform: `scale(${Math.max(0, rp)})`, opacity: Math.min(1, rp * 2) });
      edges.forEach(({ n, path, lab }) => {
        const s0 = n.rec ? 1.05 + (n.i - 6) * .08 : .55 + n.i * .06; const L0 = path.getTotalLength();
        const p = oC(P(u, s0, s0 + .18)); st(path, { strokeDasharray: n.rec ? '7 6' : L0, strokeDashoffset: n.rec ? 0 : L0 * (1 - p), opacity: n.rec ? p : 1 });
        lab.style.opacity = P(u, s0 + .1, s0 + .2);
        const k = oB(P(u, s0 + .1, s0 + .28)); st(n.el, { transform: `scale(${Math.max(0, k)})`, opacity: Math.min(1, k * 2) });
      });
      st(popv, { opacity: P(u, 1.12, 1.2), transform: `translateX(${(1 - oE(P(u, 1.12, 1.35))) * 30}px)` });
      st(chart, { opacity: P(u, 1.02, 1.1), transform: `translateX(${(1 - oE(P(u, 1.02, 1.3))) * -30}px)` });
      link.style.opacity = P(u, 1.0, 1.08);
      // real UI plate
      const pl = oE(P(u, 1.5, 1.95));
      st(plate, { opacity: P(u, 1.5, 1.62) * (1 - .45 * P(u, 2.0, 2.2)), transform: `translateX(${(1 - pl) * 120}px) rotateY(${lerp(4, 12, pl)}deg) scale(${lerp(1.2, 1, pl) * (1 + (u - 1.5) * .02)})` });
      st(stack, { opacity: win(u, 1.62, 3.0, .1, .1) });
      // left column
      st(kick, { opacity: P(u, .02, .15) * (1 - P(u, 2.84, 2.9)) });
      reveal(hA, u, .03, { stagger: .024, dur: .32, out: .47, outStagger: .006, outDur: .08 });
      reveal(hB, u, .1, { stagger: .024, dur: .32, out: .48, outStagger: .006, outDur: .08 });
      reveal(gA, u, .54, { stagger: .03, dur: .32, out: .96, outStagger: .006, outDur: .08 });
      reveal(gB, u, .6, { stagger: .03, dur: .32, out: .97, outStagger: .006, outDur: .08 });
      st(hNote, { opacity: win(u, .2, .52, .08, .06) }); st(gNote, { opacity: win(u, .7, 1.02, .08, .06) });
      st(title, { opacity: win(u, 1.02, 2.02, .04, .08) });
      reveal(tA, u, 1.04, { stagger: .022 }); reveal(tB, u, 1.1, { stagger: .022 });
      st(tSub, { opacity: P(u, 1.2, 1.32) }); st(tBad, { opacity: P(u, 1.28, 1.4) });
      const m = oE(P(u, 2.0, 2.4));
      mN.innerHTML = '+' + fmt(58.3 * m, 1) + '%';
      st(met, { opacity: P(u, 2.0, 2.05), transform: `translateY(${(1 - oE(P(u, 2.0, 2.25))) * 70}px) scale(${1 + (1 - oE(P(u, 2.0, 2.2))) * .12})` });
      st(mL, { opacity: P(u, 2.1, 2.18) }); st(mS, { opacity: P(u, 2.16, 2.24) });
      sm.forEach((d, i) => st(d, { opacity: P(u, 2.5 + i * .08, 2.58 + i * .08), transform: `translateY(${(1 - oE(P(u, 2.5 + i * .08, 2.75 + i * .08))) * 30}px)` }));
    },
  };
})();

/* ============================================================
   SCENE 4 · PUBLIC OPINION PLATFORM — G-end product lead,
   National Key R&D Program (¥30M), 3-layer IA, 5 tech teams.
   Panels are frames from the recorded platform demo.
   ============================================================ */
const PO = (() => {
  const sc = $('div', 'scene', world);
  const persp = $('div', 'layer', sc); st(persp, { perspective: '2200px', perspectiveOrigin: '1400px 540px' });
  const stackEl = $('div', 'abs', persp); st(stackEl, { left: '940px', top: '270px', width: '920px', height: '518px', transformStyle: 'preserve-3d' });
  const imgs = ['po-bubbles.jpg', 'po-network.jpg', 'po-sankey.jpg'];
  const panels = imgs.map(f => { const p = $('div', 'panel', stackEl); st(p, { backgroundImage: `url(assets/${f})`, left: '0px', top: '0px' }); return p; });
  const svg = S('svg', { class: 'full', viewBox: '0 0 1920 1080' }, sc);
  const teams = [0, 1, 2, 3, 4].map(i => S('path', { d: `M ${-20} ${250 + i * 150} C 520 ${250 + i * 150}, 980 540, 1400 530`, fill: 'none', stroke: '#00e8c8', 'stroke-width': 2, opacity: .8 }, svg));
  const hubDot = S('circle', { cx: 1400, cy: 530, r: 10, fill: '#00e8c8' }, svg);
  // left column
  const L = $('div', 'abs', sc); pos(L, 96, 214);
  const kick = $('div', 'kicker', L, '04 · Graduate · product lead · 2024.09 — 2025.04');
  const tA = Letters(L, 'PUBLIC', 'display', { fontSize: '108px', marginTop: '26px' });
  const tB = Letters(L, 'OPINION', 'display', { fontSize: '108px' });
  const sub = $('div', 'meta', L, 'Cross-platform social media public opinion<br>event tracking &amp; governance platform'); st(sub, { fontSize: '19px', marginTop: '22px', lineHeight: '1.5', color: 'var(--text)' });
  const bad = $('div', '', L, '<span class="badge">NATIONAL KEY R&amp;D PROGRAM · ¥30M</span>'); st(bad, { marginTop: '22px' });
  const ia = $('div', 'abs', sc); pos(ia, 96, 690);
  ia.innerHTML = '<div class="meta" style="font-size:13px;letter-spacing:.22em;color:var(--dimmer);margin-bottom:10px">3-LAYER INFORMATION ARCHITECTURE</div>' +
    ['BIG SCREEN', 'WORKBENCH DASHBOARD', 'VISUALIZATION MIDDLE PLATFORM'].map((s, i) => `<div class="evrow" style="margin:6px 0"><span style="color:var(--teal)">0${i + 1}</span><span>${s}</span></div>`).join('');
  const iaRows = [...ia.querySelectorAll('.evrow')];
  const teamLab = $('div', 'abs kicker', sc, '5 tech teams coordinated'); pos(teamLab, 96, 880); st(teamLab, { fontSize: '20px' });
  const zero = $('div', 'abs display', sc, '0<span style="color:var(--teal)">→</span>1'); st(zero, { fontSize: '230px' }); pos(zero, 96, 300);
  const zeroL = $('div', 'abs meta', sc, '0-TO-1 PRODUCT DESIGN · DELIVERED'); pos(zeroL, 104, 610); st(zeroL, { fontSize: '19px', color: 'var(--text)', letterSpacing: '0.14em' });

  const t0 = T.po[0];
  return {
    render(t) {
      const on = t >= t0 - 0.02 && t < T.po[1] + 0.01; show(sc, on); if (!on) return;
      const u = t - t0;
      // whip-pan in
      const wi = 1 - oE(P(u, 0, .28));
      st(sc, { transform: `translateX(${wi * 700}px)`, filter: wi > 0.02 ? 'url(#hblur)' : 'none' });
      // panels: hero panel → stacked 3-layer view
      const stk = ioC(P(u, .5, .9));
      const spin = (u - .5) * 6;
      st(stackEl, { transform: `rotateX(${lerp(0, 56, stk)}deg) rotateY(${lerp(-14, 0, stk)}deg) rotateZ(${lerp(0, -34 - spin * stk, stk)}deg) scale(${lerp(1, .78, stk)}) translateZ(${lerp(0, -80, stk)}px)` });
      panels.forEach((p, i) => {
        const inn = i === 0 ? 1 : oE(P(u, .5 + i * .06, .8 + i * .06));
        const z = lerp(0, 190 - i * 190, stk);
        const x = i === 0 ? 0 : (1 - inn) * 900;
        st(p, { transform: `translate3d(${x}px, 0, ${z}px)`, opacity: i === 0 ? 1 : inn, filter: `brightness(${lerp(1, .82 + i * .06, stk)})` });
      });
      // five teams converge
      teams.forEach((pth, i) => { const L0 = pth.getTotalLength(); const p = oC(P(u, 1.0 + i * .03, 1.3 + i * .03)); st(pth, { strokeDasharray: L0, strokeDashoffset: L0 * (1 - p), opacity: .75 * (1 - P(u, 1.72, 1.9)) }); });
      st(hubDot, { transform: `scale(${oB(P(u, 1.28, 1.42))})`, transformOrigin: '1400px 530px', opacity: 1 - P(u, 1.72, 1.9) });
      st(teamLab, { opacity: win(u, 1.05, 1.52, .08, .06) });
      // left column
      const colOut = P(u, 1.46, 1.54);
      st(L, { opacity: 1 - colOut });
      st(kick, { opacity: P(u, .05, .18) });
      reveal(tA, u, .06, { stagger: .026 }); reveal(tB, u, .12, { stagger: .026 });
      st(sub, { opacity: P(u, .25, .38) }); st(bad, { opacity: P(u, .32, .44) });
      st(ia, { opacity: win(u, .55, 1.5, .06, .06) });
      iaRows.forEach((r, i) => st(r, { opacity: P(u, .6 + i * .07, .68 + i * .07), transform: `translateX(${(1 - oE(P(u, .6 + i * .07, .85 + i * .07))) * -24}px)` }));
      const zp = oE(P(u, 1.5, 1.72));
      st(zero, { opacity: P(u, 1.5, 1.54), transform: `scale(${lerp(1.35, 1, zp)})`, transformOrigin: '0 50%' });
      st(zeroL, { opacity: P(u, 1.62, 1.7) });
      st(persp, { opacity: 1 - .5 * P(u, 1.5, 1.7) });
    },
  };
})();

/* ============================================================
   SCENE 5 · UNDERGRADUATE — three real projects, an eighth note each
   ============================================================ */
const UG = (() => {
  const sc = $('div', 'scene', world);
  const F = [
    { img: 'ug-coco.jpg', t: 'COCOCREATE', k: 'VR participatory design platform', n: '01' },
    { img: 'ug-qibaishi.jpg', t: 'QI BAISHI × AIGC', k: 'SD + LoRA + ControlNet · 1000 → 15 training images', n: '02', light: 1 },
    { img: 'ug-l3.jpg', t: 'L3 TAKEOVER HMI', k: 'Huawei UCD × Hunan University', n: '03', wide: 1 },
  ];
  F.forEach(f => {
    f.el = $('div', 'flash', sc);
    f.im = $('div', 'img', f.el); st(f.im, { backgroundImage: `url(assets/${f.img})` });
    if (f.wide) st(f.im, { backgroundSize: '100% auto', backgroundRepeat: 'no-repeat', backgroundPosition: 'center 38%', backgroundColor: '#000' });
    $('div', 'shade', f.el);
    const ttl = $('div', 'ttl', f.el);
    const kk = $('div', 'kicker', ttl, `Undergraduate · ${f.n}`); st(kk, { marginBottom: '14px' });
    f.tt = $('div', 'display', ttl, f.t);
    const k2 = $('div', 'meta', ttl, f.k); st(k2, { fontSize: '20px', marginTop: '18px', color: 'var(--text)' });
  });
  const top = $('div', 'abs kicker', sc, 'Hunan University · Industrial Design · ranked 1st · 2020 — 2024'); pos(top, 96, 100); st(top, { color: 'var(--text)', fontSize: '15px' });
  return {
    layout() { F.forEach(f => { show(f.el, true); st(f.tt, { fontSize: '100px' }); const w = f.tt.getBoundingClientRect().width; st(f.tt, { fontSize: Math.min(150, 100 * 1600 / w) + 'px' }); show(f.el, false); }); },
    render(t) {
      const on = t >= T.ug[0] && t < T.ug[1]; show(sc, on); if (!on) { F.forEach(f => show(f.el, false)); return; }
      const u = t - T.ug[0];
      const idx = Math.min(F.length - 1, Math.floor(u / .25));
      F.forEach((f, i) => {
        show(f.el, i === idx);
        if (i !== idx) return;
        const v = (u - i * .25) / .25;
        st(f.im, { transform: `scale(${1.12 - .08 * oC(v)}) translateX(${(i % 2 ? 1 : -1) * v * 20}px)` });
      });
    },
  };
})();

/* ============================================================
   SCENE 6 · NAME — the Möbius band comes into focus
   ============================================================ */
const END = (() => {
  const sc = $('div', 'scene', world);
  const glow = $('div', 'layer', sc); st(glow, { background: 'radial-gradient(ellipse 40% 24% at 50% 50%, rgba(10,12,18,0.9) 0%, rgba(10,12,18,0.6) 55%, rgba(10,12,18,0) 100%)' });
  const wrap = $('div', 'layer', sc);
  const name = Letters(wrap, 'QU FEIYUAN', 'display abs', { fontSize: '176px', letterSpacing: '0.04em' });
  const zh = $('div', 'abs', wrap, '屈非塬'); st(zh, { fontFamily: 'var(--zh)', fontWeight: 700, fontSize: '54px', letterSpacing: '0.62em', color: 'var(--text)' });
  const rule = $('div', 'abs', wrap); st(rule, { height: '2px', background: 'var(--teal)', width: '0px' });
  const role = $('div', 'abs kicker', wrap); st(role, { fontSize: '21px', letterSpacing: '0.34em' });
  const cur = $('span', '', null); st(cur, { display: 'inline-block', width: '3px', height: '22px', background: 'var(--teal)', verticalAlign: '-3px', marginLeft: '4px' });
  const bl = $('div', 'abs meta', wrap, 'STATE KEY LAB OF CAD&amp;CG · ZHEJIANG UNIVERSITY'); pos(bl, 96, 990); st(bl, { fontSize: '14px', letterSpacing: '0.2em' });
  const br = $('div', 'abs meta', wrap, 'QFY1012.GITHUB.IO'); st(br, { right: '96px', top: '990px', fontSize: '14px', letterSpacing: '0.2em', color: 'var(--text)' });
  let NFS = 130, RW = 800;
  return {
    layout() {
      st(name.root, { fontSize: '100px', letterSpacing: '0.04em' }); const w0 = name.root.getBoundingClientRect().width; NFS = 100 * 1320 / w0; st(name.root, { fontSize: NFS + 'px' });
      const b = name.root.getBoundingClientRect(); pos(name.root, (W - b.width) / 2, 540 - b.height / 2 - 60);
      const z = zh.getBoundingClientRect(); pos(zh, (W - z.width) / 2 + 17, 600);
      role.textContent = 'DESIGN · ENGINEERING · AI'; RW = role.getBoundingClientRect().width;
    },
    render(t) {
      const on = t >= T.end[0]; show(sc, on); if (!on) return;
      const u = t - T.end[0];
      st(wrap, { transform: `scale(${1 + u * .012})`, transformOrigin: '50% 50%' });
      glow.style.opacity = P(u, .2, .8);
      // letter-spacing breathes in while glyphs rise
      const ls = lerp(0.42, 0.04, oE(P(u, .18, 1.4)));
      st(name.root, { letterSpacing: ls + 'em' });
      const b = name.root.getBoundingClientRect(); const sc_ = 1 + u * .012; pos(name.root, (W - b.width / sc_) / 2, 540 - b.height / sc_ / 2 - 60);
      reveal(name, u, .2, { stagger: .045, dur: .6 });
      st(zh, { opacity: P(u, .85, 1.1), transform: `translateY(${(1 - oE(P(u, .85, 1.3))) * 20}px)` });
      const rw = oE(P(u, .8, 1.3)) * 140; st(rule, { width: rw + 'px', left: (W - rw) / 2 + 'px', top: '570px' });
      const txt = 'DESIGN · ENGINEERING · AI';
      role.textContent = typed(txt, u, 1.2, 44); role.appendChild(cur);
      cur.style.opacity = (u < 1.2 + txt.length / 44 + .05) || (Math.floor(u * 2.2) % 2 === 0) ? 1 : 0;
      role.style.opacity = P(u, 1.15, 1.2);
      pos(role, (W - RW) / 2 + 12, 716);
      st(bl, { opacity: P(u, 1.6, 1.9) }); st(br, { opacity: P(u, 1.7, 2.0) });
    },
  };
})();

/* ============================================================
   frame renderer
   ============================================================ */
function camShake(t) {
  let x = 0, y = 0;
  HITS.forEach((h, i) => { const d = t - h; if (d >= 0 && d < .22) { const a = (1 - d / .22) ** 2 * (h === 12.5 ? 12 : 6); x += Math.sin(d * 95 + i) * a; y += Math.cos(d * 80 + i * 2) * a; } });
  return [x, y];
}
function particles(t) {
  const endU = t - T.end[0];
  if (t < 1.6) {
    // opening haze: the band far out of focus behind the tagline
    PT.draw({ spin: 0.9 + t * 0.35, tilt: 1.12, roll: -0.12, cx: 960, cy: 560, coc: 0.05, blurAll: 14, alpha: 1.1, gather: 1, fade: 0.55 * P(t, 0, .25) * (1 - P(t, 1.3, 1.6)) });
  } else if (t >= T.end[0]) {
    const g = P(endU, 0, 1.25);
    const focus = ioC(P(endU, .15, 1.35));
    PT.draw({ spin: 1.4 + endU * 0.32, tilt: 1.2, roll: -0.1, cx: 960, cy: 545, coc: lerp(0.05, 0.024, focus), blurAll: lerp(5, 0.3, focus), alpha: lerp(4.0, 1.15, focus), gather: g, fade: P(endU, 0, .06) });
  } else PT.clear();
}
function renderFrame(t) {
  t = clamp(t, 0, DUR - 1e-6);
  const frame = Math.round(t * FPS);
  particles(t);
  INTRO.render(t); ALI.render(t); NS_.render(t); TOA.render(t); PO.render(t); UG.render(t); END.render(t);
  HUD.render(t);
  const [sx, sy] = camShake(t);
  world.style.transform = `translate(${sx}px, ${sy}px)`;
  // whip blur strength (ToA → Public Opinion)
  const wb = Math.max(iE(P(t, T.toa[0] + 2.84, T.toa[0] + 3.0)), 1 - oE(P(t, T.po[0], T.po[0] + .28)));
  hblurStd.setAttribute('stdDeviation', `${(wb * 40).toFixed(1)} 0`);
  // flashes: undergrad cuts + the final hit
  let fl = 0;
  [11.75, 12.0, 12.25].forEach(c => { const d = t - c; if (d >= 0 && d < .07) fl = Math.max(fl, .55 * (1 - d / .07)); });
  { const d = t - 12.5; if (d >= 0 && d < .18) fl = Math.max(fl, (1 - d / .18) ** 3); }
  flashfx.style.opacity = fl;
  GR.draw(Math.floor(frame / 3)); // grain at 20 fps: filmic, and far kinder to the encoder
}

async function boot() {
  await document.fonts.ready;
  await Promise.all(['Syne', 'JetBrains Mono', 'PingFang SC'].flatMap(f => [400, 500, 600, 700, 800].map(w => document.fonts.load(`${w} 40px "${f}"`, '屈非塬评估自动修订入库设计开发研究Aa'))));
  const srcs = ['toa-interface.png', 'po-bubbles.jpg', 'po-network.jpg', 'po-sankey.jpg', 'ug-coco.jpg', 'ug-qibaishi.jpg', 'ug-l3.jpg'];
  await Promise.all(srcs.map(s => { const i = new Image(); i.src = 'assets/' + s; return i.decode().catch(() => console.warn('missing', s)); }));
  INTRO.layout(); NS_.layout(); TOA.layout(); UG.layout(); END.layout();
  window.renderFrame = renderFrame;
  window.SHOWREEL = { duration: DUR, fps: FPS };
  const q = new URLSearchParams(location.search);
  if (q.has('play')) {
    document.body.classList.add('preview');
    const start = performance.now();
    const loop = () => { renderFrame(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); };
    loop();
  } else renderFrame(parseFloat(q.get('t') || '0'));
  window.__ready = true;
}
boot();
